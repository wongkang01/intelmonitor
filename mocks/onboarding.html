<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IntelMonitor onboarding mocks</title>
<style>
:root{
  --canvas:oklch(0.972 0.004 260);
  --surface:oklch(0.993 0.002 260);
  --rail:oklch(0.955 0.005 260);
  --hover:oklch(0.925 0.006 260);
  --line:oklch(0.93 0.005 260);
  --line-strong:oklch(0.885 0.007 260);
  --line-field:oklch(0.80 0.01 260);
  --ink:oklch(0.23 0.012 260);
  --ink2:oklch(0.47 0.014 260);
  --ink3:oklch(0.56 0.012 260);
  --accent:oklch(0.52 0.17 258);
  --accent-strong:oklch(0.46 0.16 258);
  --new:oklch(0.48 0.15 258); --new-bg:oklch(0.955 0.022 250);
  --watch:oklch(0.47 0.105 62); --watch-bg:oklch(0.965 0.035 80);
  --attn:oklch(0.50 0.17 28); --attn-bg:oklch(0.955 0.022 25);
  --stable:oklch(0.47 0.10 155);
  --mark:oklch(0.94 0.07 95);
  --on-ink:oklch(0.97 0.004 260);
  --on-ink2:oklch(0.80 0.01 260);
  --on-ink-link:oklch(0.80 0.10 258);
  /* Radius: badge 4, control 6, widget, panel and popover 10, popup and sheet 14. The drawer is square. */
  --r-badge:4px; --r-ctl:6px; --r-widget:10px; --r-sheet:14px;
  /* Depth: one thin low shadow on in-page surfaces. Overlays add a 1px border. */
  --shadow-low:0 1px 3px oklch(0.23 0.012 260 / 0.11);
  --shadow-pop:0 6px 20px oklch(0.23 0.012 260 / 0.12);
  --shadow-modal:0 12px 32px oklch(0.23 0.012 260 / 0.16);
  --scrim:oklch(0.23 0.012 260 / 0.24);
  /* Type: 12 meta, 13 body and rows, 15 section and answers, 22 widget hero, 28 page title. */
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --stat:112px;
  --tb:36px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--canvas);color:var(--ink);font:400 13px/18px var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3,p,dl,dd,dt,ul{margin:0;padding:0}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.i.s12{width:12px;height:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.grow{flex:1}
.c2,.c3,.c1{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.c1{-webkit-line-clamp:1}.c2{-webkit-line-clamp:2}.c3{-webkit-line-clamp:3}
.meta{font-size:12px;line-height:16px;color:var(--ink2)}
.num{font-variant-numeric:tabular-nums}
.lk{color:var(--accent);font-weight:500}
.lk:hover{text-decoration:underline}
.sl:hover{text-decoration:underline}
.t-attn{color:var(--attn)}.t-watch{color:var(--watch)}.t-stable{color:var(--stable)}.t-new{color:var(--new)}.t-upd{color:var(--ink2)}
.arr{color:var(--ink2);font-weight:400;padding:0 2px}

/* Mock toolbar (not part of the design) */
.tb{height:var(--tb);display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--ink);color:var(--on-ink);font-size:12px;white-space:nowrap}
.tb b{font-weight:600}
.tbs{display:flex;gap:2px;padding:2px;border-radius:var(--r-ctl);background:oklch(0.32 0.012 260)}
.tbs button{height:24px;padding:0 10px;border-radius:var(--r-badge);color:var(--on-ink2)}
.tbs button[aria-pressed=true]{background:var(--on-ink);color:var(--ink);font-weight:500}
.tbt{height:24px;padding:0 10px;border-radius:var(--r-badge);border:1px solid oklch(0.40 0.012 260);color:var(--on-ink2)}
.tbt[aria-pressed=true]{border-color:var(--on-ink);color:var(--on-ink)}
.tbn{margin-left:auto;color:var(--on-ink2);overflow:hidden;text-overflow:ellipsis}

/* Shell */
.app{height:calc(100vh - var(--tb));display:grid;grid-template-columns:232px minmax(0,1fr)}
.side{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{height:56px;display:flex;align-items:center;padding:0 16px;font-size:15px;font-weight:600;letter-spacing:-.01em;flex:none}
.nav{flex:1;overflow:auto;padding:4px 8px 16px}
.nl{font-size:12px;line-height:16px;font-weight:500;color:var(--ink2);padding:16px 8px 4px}
.nl:first-child{padding-top:4px}
.ni{position:relative;width:100%;height:32px;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:var(--r-ctl);font-weight:500;color:var(--ink)}
.ni:hover{background:var(--hover)}
.ni[aria-current=page]{background:var(--surface);box-shadow:var(--shadow-low);font-weight:600}
.ni .i{color:var(--ink2)}
.ni .cnt{margin-left:auto;font-size:12px;font-weight:400;color:var(--ink2);font-variant-numeric:tabular-nums}
.ni.sub{padding-left:32px}
.ni .chev{transition:transform .15s ease-out}
.ni[aria-expanded=true] .chev{transform:rotate(90deg)}
.prof{flex:none;border-top:1px solid var(--line);padding:8px}
.prof button{width:100%;height:48px;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:var(--r-ctl)}
.prof button:hover{background:var(--hover)}
.av{width:28px;height:28px;border-radius:50%;background:var(--hover);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.who{display:flex;flex-direction:column;line-height:16px;min-width:0}
.who b{font-weight:500}
.main{position:relative;overflow:auto;min-width:0}
.top{position:sticky;top:0;z-index:30;height:56px;display:flex;align-items:center;gap:8px;padding:0 32px;background:var(--canvas);border-bottom:1px solid var(--line)}
.search{flex:1;height:32px;display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;background:var(--surface);border:1px solid var(--line-field);border-radius:var(--r-ctl);color:var(--ink3)}
.search:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);height:30px}
.search input::placeholder{color:var(--ink3)}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none}
.kbd{height:20px;padding:0 5px;border:1px solid var(--line-strong);border-radius:var(--r-badge);font-size:12px;line-height:18px;color:var(--ink2);font-variant-numeric:tabular-nums}
.trw{position:relative;flex:none}
.chip{height:32px;min-width:224px;display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-ctl);color:var(--ink2);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
.chip .chev{margin-left:auto;color:var(--ink3);transition:transform .15s ease-out}
.chip[aria-expanded=true] .chev{transform:rotate(180deg)}
.chip:hover,.bell:hover,.chip[aria-expanded=true],.bell[aria-expanded=true]{background:var(--hover)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--stable);flex:none}
.half{width:8px;height:8px;flex:none;color:var(--new)}
.bell{height:32px;min-width:32px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 7px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-ctl);color:var(--ink2)}
.cntb{height:16px;padding:0 4px;border-radius:var(--r-badge);font-size:12px;line-height:16px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--attn-bg);color:var(--attn)}
/* 44px hit areas for 32px controls */
.chip,.bell,.btn,.ib,.minus{position:relative}
.chip::after,.bell::after,.btn::after{content:"";position:absolute;inset:-6px -2px}
.ib::after,.minus::after{content:"";position:absolute;inset:-8px}

/* Popovers */
.pop{position:absolute;right:0;top:calc(100% + 8px);width:400px;max-height:min(560px,calc(100vh - 96px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-widget);box-shadow:var(--shadow-pop);overflow:hidden;z-index:40}
.ph{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;border-bottom:1px solid var(--line)}
.ph b{font-weight:600}
.pb{overflow:auto;flex:1}
.pf{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;border-top:1px solid var(--line)}
.pg{font-size:12px;line-height:16px;font-weight:500;color:var(--ink2);padding:12px 16px 4px}
.rr{display:grid;grid-template-columns:16px minmax(0,1fr) auto;column-gap:12px;align-items:start;padding:8px 16px;border-top:1px solid var(--line)}
.rr .meta{grid-column:2/4;margin-top:2px}
.pb>.rr:first-child{border-top:0}
.rr .mk{height:18px;display:flex;align-items:center}
.rr .mk .i{width:12px;height:12px;stroke-width:2}
.rr b{font-weight:500}
.rr .res{font-size:12px;line-height:18px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ar{width:100%;display:grid;grid-template-columns:var(--stat) minmax(0,1fr);gap:12px;align-items:start;padding:8px 16px;border-top:1px solid var(--line)}
.ar:hover,.ar:focus-visible,.rr:hover{background:var(--hover)}
.ar:focus-visible{outline-offset:-2px}
.ar .tt{font-weight:500}

/* Buttons and fields */
.btn{height:32px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:var(--r-ctl);font-weight:500;white-space:nowrap;background:var(--surface);border:1px solid var(--line-strong);color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.pri:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.sm{height:28px;padding:0 10px}
.btn.gh{background:none;border-color:transparent}
.btn.gh:hover{background:var(--hover)}
.btn.gh.ac{color:var(--accent)}
.btn:disabled,.btn:disabled:hover{background:var(--surface);border-color:var(--line-strong);color:var(--ink3);cursor:default}
.btn.gh:disabled,.btn.gh:disabled:hover{background:none;border-color:transparent}
.ib{width:28px;height:28px;display:grid;place-items:center;border-radius:var(--r-ctl);color:var(--ink2);flex:none}
.ib:hover{background:var(--hover);color:var(--ink)}
.fld{height:32px;padding:0 10px;background:var(--surface);border:1px solid var(--line-field);border-radius:var(--r-ctl);color:var(--ink)}
.fld::placeholder,textarea::placeholder{color:var(--ink3)}
.fld:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea.fld{height:64px;padding:6px 10px;resize:vertical;width:100%;display:block}
.seg{display:inline-flex;height:28px;padding:2px;gap:2px;background:var(--rail);border-radius:var(--r-ctl);flex:none}
.seg button{height:24px;padding:0 10px;border-radius:var(--r-badge);border:1px solid transparent;color:var(--ink2);font-weight:500;font-size:12px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}

/* Badges */
.b{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:var(--r-badge);font-size:12px;line-height:18px;font-weight:500;white-space:nowrap}
.b-attn{background:var(--attn-bg);color:var(--attn)}
.b-watch{background:var(--watch-bg);color:var(--watch)}
.b-new{background:var(--new-bg);color:var(--new)}
.b-upd,.b-custom{background:var(--rail);color:var(--ink2)}
.b-stable{padding:0;color:var(--stable)}

/* Page */
.page{padding:24px 32px 48px}
.ph1{display:flex;align-items:flex-end;gap:8px;margin-bottom:24px}
.ph1 h1{font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.015em}
.ph1 p{margin-top:2px;color:var(--ink2)}
.ph1 p a{color:var(--ink2)}
.ph1 p a:hover{color:var(--ink);text-decoration:underline}

/* Widget grid */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:176px;gap:16px;grid-auto-flow:row dense}
.w{position:relative;background:var(--surface);border-radius:var(--r-widget);box-shadow:var(--shadow-low);padding:12px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.w.z-M{grid-column:span 2}.w.z-L{grid-column:span 2;grid-row:span 2}
.wh{display:flex;align-items:baseline;gap:8px;min-height:16px;margin-bottom:8px}
.wt{font-size:12px;line-height:16px;font-weight:500;color:var(--ink2);white-space:nowrap}
a.wt:hover{color:var(--ink);text-decoration:underline}
.wm{margin-left:auto;font-size:12px;line-height:16px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hero{font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.01em;margin-bottom:8px}
.ans{font-size:15px;line-height:20px;font-weight:600}
.wf{margin-top:auto;display:flex;align-items:center;gap:8px;padding-top:8px}
.wf .meta{margin-left:auto}
.gl{display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;font-weight:500;padding:4px 0}
.gl .lk{margin-left:auto;font-size:12px}
.gl .dot{background:currentColor}
.rows{display:flex;flex-direction:column;min-height:0}
.r{display:grid;grid-template-columns:var(--stat) minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.r.ns{grid-template-columns:minmax(0,1fr) auto}
.r .tt{font-weight:500;min-width:0}
.r .d{font-size:12px;line-height:16px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.r .sc{align-self:start}
button.r:hover .tt,a.r:hover .tt{text-decoration:underline;text-decoration-color:var(--line-field)}
.w .r .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qs2{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
.qr{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-top:1px solid var(--line);min-width:0}
.qr .ql{color:var(--ink2);white-space:nowrap}
.qr .qa{margin-left:auto;font-weight:600;text-align:right}
.spark{display:block;width:100%;height:40px;margin:8px 0;color:var(--ink2)}
.ent{display:grid;grid-template-columns:var(--stat) minmax(0,1fr) 28px;gap:0 12px;padding:8px 0;border-top:1px solid var(--line)}
.ent .en{display:flex;align-items:baseline;gap:8px}
.ent .en b{font-weight:600}
.ent .hs{margin-top:2px}
.ent .lt{display:flex;gap:8px;margin-top:2px}
.ent .lt span:first-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent .ib{margin-top:-5px}
.add{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--line-field);border-radius:var(--r-ctl);color:var(--ink3);margin-bottom:8px;background:var(--surface)}
.add input{flex:1;border:0;outline:0;background:none;min-width:0;color:var(--ink)}
.add input::placeholder{color:var(--ink3)}
.add:focus-within{outline:2px solid var(--accent);outline-offset:2px}

/* Edit mode */
.editing .w{outline:1px dashed var(--accent);outline-offset:-1px;cursor:grab}
.editing .w .wh{padding-right:28px}
.minus{position:absolute;top:8px;right:8px;width:24px;height:24px;display:grid;place-items:center;border-radius:var(--r-ctl);background:var(--surface);border:1px solid var(--line-strong);color:var(--ink2);z-index:2}
.minus:hover{background:var(--hover);color:var(--ink)}
.toast{position:fixed;left:264px;bottom:24px;z-index:70;height:36px;display:flex;align-items:center;gap:12px;padding:0 8px 0 12px;background:var(--ink);color:var(--on-ink);border-radius:var(--r-ctl);box-shadow:var(--shadow-pop)}
.toast button{height:28px;padding:0 8px;border-radius:var(--r-badge);color:var(--on-ink-link);font-weight:600}
.toast button:hover{background:oklch(0.32 0.012 260)}

/* Monitor page */
.mon{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:16px;align-items:start}
.panel{background:var(--surface);border-radius:var(--r-widget);box-shadow:var(--shadow-low);padding:16px}
.rail{position:sticky;top:80px}
.sec+.sec{margin-top:32px}
.sh{display:flex;align-items:baseline;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line-strong)}
.sh h2{font-size:15px;line-height:20px;font-weight:600}
.sh .meta{margin-left:auto}
.lead{display:flex;align-items:baseline;gap:8px;padding:12px 0 8px}
.lead b{font-weight:600}
.sub3{font-size:12px;line-height:16px;font-weight:500;color:var(--ink2);padding:16px 0 4px}
.mon .r{align-items:start}
.mon .r .tt{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.mon .r .d{line-height:18px}
.mon .r .meta{margin-top:2px}
.qrow .ql{font-weight:500;display:flex;align-items:center;gap:8px}
.qrow .qq{font-size:12px;line-height:16px;color:var(--ink2);margin-top:2px}
.qrow .qa{margin-top:4px;max-width:70ch}
.qrow .meta{margin-top:4px}
.more{margin-top:8px}
dl.links{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px 12px;padding:12px 0}
dl.links dt{font-size:12px;line-height:18px;font-weight:500;color:var(--ink2)}
dl.links a{color:var(--ink)}
dl.links a:hover{text-decoration:underline}
.act{padding-top:12px;display:flex;flex-direction:column;gap:12px}
.act .rw{display:flex;align-items:center;gap:12px}

/* Evidence drawer */
.drawer{position:fixed;top:calc(var(--tb) + 56px);right:0;bottom:0;width:520px;z-index:20;background:var(--surface);border-left:1px solid var(--line-strong);box-shadow:var(--shadow-pop);display:flex;flex-direction:column}
.dh{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px 0 20px;border-bottom:1px solid var(--line)}
.dh h2{font-size:15px;line-height:20px;font-weight:600}
.db{flex:1;overflow:auto;padding:16px 20px 32px}
.db .ans{margin:4px 0}
.dsec{font-size:12px;line-height:16px;font-weight:500;color:var(--ink2);padding:24px 0 8px;border-bottom:1px solid var(--line-strong)}
.dev{padding:12px 0;border-bottom:1px solid var(--line)}
.dev .top2{display:flex;align-items:center;gap:8px}
.dev .tt{font-weight:600;margin-top:8px}
.src{padding:12px 0 0 12px;margin-top:12px;border-top:1px solid var(--line)}
.src a{color:var(--accent);font-weight:500}
.src a:hover{text-decoration:underline}
.src .pass{margin-top:6px;color:var(--ink);max-width:70ch}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}

/* Sheet and popup */
.scrim{position:fixed;inset:var(--tb) 0 0 0;background:var(--scrim);z-index:50}
.modal{position:fixed;z-index:51;left:50%;top:calc(var(--tb) + (100vh - var(--tb)) / 2);transform:translate(-50%,-50%);width:min(1152px,calc(100vw - 64px));height:min(772px,calc(100vh - var(--tb) - 48px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sheet);box-shadow:var(--shadow-modal);overflow:hidden}
.mh{height:48px;flex:none;display:flex;align-items:center;gap:16px;padding:0 12px 0 20px;border-bottom:1px solid var(--line)}
.mh h2{font-size:15px;line-height:20px;font-weight:600}
.mh .ib{margin-left:auto}
.mb{flex:1;min-height:0;display:flex;flex-direction:column}
.mf{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;border-top:1px solid var(--line)}
.mf label{font-weight:500}
.mf .fld{width:260px}
.gbar{height:40px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line)}
.gbar .lk{display:inline-flex;align-items:center;gap:4px}
.gal{flex:1;min-height:0;display:grid;grid-template-columns:240px minmax(0,1fr)}
.subs{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.subs .search{flex:none;margin:12px 12px 4px;height:32px}
.subs .list{overflow:auto;padding:0 8px 12px}
.subs .ni{height:30px}
.subs .ni .cnt{color:var(--ink2)}
.offers{overflow:auto;background:var(--canvas);padding:20px 24px 32px}
.oh{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.oh h3{font-size:15px;line-height:20px;font-weight:600}
.og{font-size:12px;line-height:16px;font-weight:500;color:var(--ink2);padding:20px 0 8px;border-bottom:1px solid var(--line-strong);margin-bottom:16px}
.offer{display:grid;grid-template-columns:184px auto;gap:24px;align-items:start;margin-bottom:24px}
.offer .on{font-weight:600;margin-bottom:8px}
.offer .oc{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.pv{width:544px}
.pv.z-S{width:264px;height:176px}.pv.z-M{height:176px}.pv.z-L{height:368px}
.pv .w{height:100%}
.canvas{flex:1;min-height:0;overflow:auto;background:var(--canvas);padding:16px 20px 24px}
.canvas .grid{grid-template-columns:repeat(4,264px);justify-content:start}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ch b{font-weight:600}
.chat{flex:none;padding:12px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.chat .you{color:var(--ink2)}
.chat details summary{cursor:pointer;list-style:none}
.chat details summary b{font-weight:600}
.chat details summary::-webkit-details-marker{display:none}
.chat details ul{list-style:none;margin-top:4px;color:var(--ink2)}
.dock{flex:none;display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line)}
.dock .fld{flex:1}
.pend{display:flex;align-items:center;gap:4px;color:var(--ink2)}
.pend b{color:var(--ink);font-weight:500;margin-right:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:1180px){.app{grid-template-columns:200px minmax(0,1fr)}.mon{grid-template-columns:minmax(0,1fr)}.rail{position:static}.toast{left:232px}}

/* Shared additions matching the running app (dashboard dots, entity icons, rail links, profile menu). */
:root{
  --dash-blue:oklch(0.58 0.14 255);--dash-teal:oklch(0.6 0.1 195);--dash-purple:oklch(0.55 0.15 300);--dash-slate:oklch(0.55 0.03 250);
}
.dash-dot{width:8px;height:8px;flex:none;border-radius:50%}
.ni .i.sm{width:14px;height:14px}
.ent-icon{--ei:16px;width:var(--ei);height:var(--ei);flex:none;display:inline-grid;place-items:center;overflow:hidden;border-radius:var(--r-badge);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink2);vertical-align:middle}
.ent-icon svg{width:100%;height:100%}
.ent-icon.s28{--ei:28px;border-radius:var(--r-ctl);background:var(--rail)}
.ent-icon.s28 .i{width:16px;height:16px}
.ph1 .ttl{display:flex;align-items:center;gap:12px}
.ph1 .ttl .dash-dot{width:10px;height:10px}
dl.links{grid-template-columns:64px minmax(0,1fr);gap:0 12px;padding:4px 0 12px}
dl.links dt{padding-top:12px}
dl.links dd{display:flex;flex-direction:column}
dl.links dd a{height:44px;display:flex;align-items:center;border-bottom:1px solid var(--line)}
/* Profile menu, opening upward */
.pwrap{position:relative}
.pmenu{position:absolute;left:8px;right:8px;bottom:calc(100% + 4px);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-widget);box-shadow:var(--shadow-pop);padding:4px;z-index:45}
.pmenu button{width:100%;height:32px;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:var(--r-ctl);font-weight:500;position:relative}
.pmenu button::after{content:"";position:absolute;inset:-6px 0}
.pmenu button:hover,.pmenu button.hl{background:var(--hover)}
.pmenu button .i{color:var(--ink2)}
.pmenu .kbd{margin-left:auto}
.pmenu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
/* Mock chrome: a second toolbar line naming the direction and its trade-off */
.tb{flex-wrap:nowrap}
.tbd{min-height:32px;display:flex;align-items:center;gap:12px;padding:6px 16px;background:oklch(0.30 0.012 260);color:var(--on-ink);font-size:12px;line-height:16px}
.tbd b{font-weight:600;white-space:nowrap}
.tbd span{color:var(--on-ink2)}
body.two .app{height:calc(100vh - var(--tb) - var(--tbd,32px))}

/* Onboarding mock */
.tbd{height:32px;min-height:0;white-space:nowrap;overflow:hidden}
.drawer{top:calc(var(--tb) + 32px + 56px)}
.ring{position:fixed;z-index:60;border-radius:var(--r-widget);pointer-events:none}
.ring.cut{box-shadow:0 0 0 9999px var(--scrim)}
.ring.acc{outline:2px solid var(--accent);outline-offset:2px}
.coach{position:fixed;z-index:61;width:320px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-widget);box-shadow:var(--shadow-pop);padding:12px 16px 12px}
.coach .ch2{display:flex;align-items:center;gap:8px;height:28px}
.coach .ch2 .ib{margin-left:auto;margin-right:-8px}
.coach h3{font-size:15px;line-height:20px;font-weight:600;margin:4px 0 4px}
.coach p{margin:0}
.coach .cf{display:flex;align-items:center;gap:8px;margin-top:16px}
.coach .cf .grow{flex:1}
.caret{position:absolute;width:10px;height:10px;background:var(--surface);border:1px solid var(--line-strong);transform:rotate(45deg)}
.caret.l{left:-6px;border-right:0;border-top:0}
.caret.r{right:-6px;border-left:0;border-bottom:0}
.caret.t{top:-6px;border-right:0;border-bottom:0}
.caret.b{bottom:-6px;border-left:0;border-top:0}
/* B: checklist in the sidebar */
.gs{flex:none;border-top:1px solid var(--line);padding:8px 8px 4px}
.gs-h{display:flex;align-items:center;gap:8px;height:32px;padding:0 0 0 8px}
.gs-h b{font-weight:600}
.gs-h .ib{margin-left:auto}
.gs-i{position:relative;width:100%;height:32px;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:var(--r-ctl);font-weight:500}
.gs-i::after{content:"";position:absolute;inset:-6px 0}
.gs-i:hover{background:var(--hover)}
.gs-i[aria-current=step]{background:var(--surface);box-shadow:var(--shadow-low)}
.gs-i.done{color:var(--ink2);font-weight:400}
.ck{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-field);flex:none;display:grid;place-items:center}
.done .ck{border-color:var(--stable);color:var(--stable)}
.ck .i{width:10px;height:10px;stroke-width:2}
/* C: overview map */
.ov{position:fixed;inset:0;z-index:60;pointer-events:none}
.omark{position:fixed;z-index:62;width:22px;height:22px;border-radius:var(--r-badge);background:var(--ink);color:var(--on-ink);font-size:12px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.ovp{position:fixed;z-index:63;right:32px;bottom:24px;width:384px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sheet);box-shadow:var(--shadow-modal);display:flex;flex-direction:column}
.ovp .mh{height:48px}
.ovp ol{list-style:none;margin:0;padding:4px 20px 8px}
.ovp li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ovp li:first-child{border-top:0}
.ovp li .n2{width:22px;height:22px;border-radius:var(--r-badge);background:var(--ink);color:var(--on-ink);font-size:12px;font-weight:600;display:grid;place-items:center}
.ovp li b{font-weight:600;display:block}
.ovp .mf{height:56px}
/* Help */
.hsec{padding-top:8px}
.hsec h3{font-size:15px;line-height:20px;font-weight:600;padding:16px 0 8px;border-bottom:1px solid var(--line-strong)}
.hsec:first-child h3{padding-top:4px}
.gl2{display:grid;grid-template-columns:var(--stat) minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.gl2:first-of-type{border-top:0}
.gl2 .meta{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.lvl{font-weight:600}
.keys{display:grid;grid-template-columns:112px minmax(0,1fr);gap:0 12px}
.keys dt,.keys dd{padding:8px 0;border-top:1px solid var(--line);margin:0}
.keys dt:first-child,.keys dt:first-child+dd{border-top:0}
.keys dt{display:flex;gap:4px;align-items:center}
.dlg{position:fixed;z-index:51;left:50%;top:calc(36px + 32px + (100vh - 68px)/2);transform:translate(-50%,-50%);width:560px;max-height:calc(100vh - 68px - 48px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sheet);box-shadow:var(--shadow-modal);overflow:hidden}
.dlg .body{overflow:auto;padding:12px 20px 16px}
.scrim{inset:68px 0 0 0}
.helpdoc{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.hsearch{margin:4px 0 4px}

// Shared shell for the iteration mocks: helpers, sidebar, top bar, dashboard widgets. Data comes from the running API.
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ic=(n,c='')=>`<svg class="i ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const WORD={attn:'Needs attention',watch:'Watch',stable:'Stable',new:'New',upd:'Updated'};
const badge=s=>s?`<span class="b b-${s}">${WORD[s]}</span>`:'';
const stateText=(s,p)=>p&&p!==s?`<span class="t-${p}">${WORD[p]}</span><span class="arr">→</span><span class="t-${s}">${WORD[s]}</span>`:`<span class="t-${s}">${WORD[s]}</span>`;
const plural=(n,w,p)=>`${n} ${n===1?w:(p||w+'s')}`;
const logo=id=>LOGO[id]?`<span class="ent-icon">${LOGO[id]}</span>`:'';
const DASHES=[['Singapore banks','blue'],['Stablecoin watch','teal'],['Geopolitics in SEA','purple'],['OCBC','slate']];
const TOPICS=[['Banking regulation','landmark',45,'banking-regulation'],['Geopolitics','globe',34],['Stablecoins','link',17]];
const GROUPS=[['Singapore banks',35,'singapore-banks'],['SEA regional banks',49],['Central banks',144],['Stablecoin issuers',6],['SEA countries',146]];
const HALF='';

function head(t,meta,href=true){return `<div class="wh">${href?`<a class="wt" href="#">${esc(t)}</a>`:`<span class="wt">${esc(t)}</span>`}${meta?`<span class="wm">${esc(meta)}</span>`:''}</div>`}
function devRow(r,opt={}){
  return `<button class="r${opt.ns?' ns':''}" data-ev="${esc(r.id)}">${opt.ns?'':`<span class="sc">${badge(r.st)}</span>`}<span class="tt" title="${esc(r.t)}">${esc(r.t)}</span><span class="d">${esc(r.d)}</span></button>`;
}
// Widget bodies copied from mocks/refine-a.html; opt.dirFoot adds the Direction widget's trend link.
const BODY={
  since(d,z){
    return head('Since your last review',d.meta)+`<p class="hero">${esc(d.hero)}</p>
    <div class="gl t-attn"><span class="dot"></span>Needs attention · ${d.na}<a class="lk" href="#">Show all</a></div>
    <div class="rows">${d.attn.slice(0,z==='L'?6:1).map(r=>devRow(r,{ns:1})).join('')}</div>
    <div class="wf"><a class="lk" href="#" data-anchor="markall">Mark all reviewed</a><span class="meta">${esc(d.foot)}</span></div>`;
  },
  summary(d){
    return head('Standing questions',d.sub)+`<div class="qs2">${d.ans.slice(0,6).map(x=>`<a class="qr" href="#" title="${esc(x.q)}"><span class="ql">${esc(x.l)}</span><span class="qa">${x.s==='new'&&!x.p?`<span class="t-new">${x.n} new</span>`:stateText(x.s,x.p)}</span></a>`).join('')}</div>`;
  },
  direction(d,z,opt={}){
    const w=d.wk,max=Math.max(...w),min=Math.min(...w),n=w.length;
    const pts=w.map((v,i)=>`${(i/(n-1)*236+2).toFixed(1)},${(36-(v-min)/(max-min||1)*32).toFixed(1)}`);
    const last=pts[n-1].split(',');
    return head('Direction of travel',d.sub)+`<p class="ans">${esc(d.trend)}</p>
    <svg class="spark" viewBox="0 0 240 40" preserveAspectRatio="none" role="img" aria-label="Material developments per week: ${w.join(', ')}"><polyline points="${pts.join(' ')}" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="2.5" fill="var(--ink)"/></svg>
    <p class="meta">${esc(d.cap)}</p>${opt.dirFoot||''}`;
  },
  upcoming(d){
    return head('Upcoming',d.sub)+`<p class="ans">${esc(d.date)} <span class="meta" style="font-weight:400">· ${esc(d.rel)}</span></p>
    <p class="c2" style="margin-top:4px">${esc(d.l)}</p><p class="meta c2" style="margin-top:4px">${esc(d.dev)}</p>`;
  },
  question(d){
    return head(d.l,d.sub)+`<p class="ans">${stateText(d.s,d.p)}</p><p class="c3" style="margin-top:4px">${esc(d.a)}</p>
    <div class="wf"><a class="lk" href="#" data-anchor="evidence">See evidence</a></div>`;
  },
  watchlist(d,z){
    return head('Watchlist',plural(d.entries.length,'entity','entities'))+`<label class="add">${ic('plus')}<input aria-label="Add an entity" placeholder="Add a bank, central bank, issuer or country"></label>
    <div class="rows">${d.entries.map(e=>`<div class="ent"><span class="sc">${badge(e.s)}</span><div style="min-width:0">
      <div class="en">${logo(e.n.toLowerCase())}<a href="#" class="sl"><b>${esc(e.n)}</b></a><span class="meta num">${e.nn} new · ${e.na} ${e.na===1?'needs':'need'} attention</span></div>
      <p class="hs c2"><span style="color:var(--ink2)">${esc(e.hl)}:</span> ${esc(e.hs)}</p><p class="lt meta"><span>${esc(e.lt)}</span><span class="num">${esc(e.ld)}</span></p>
      </div><button class="ib" aria-label="Remove ${esc(e.n)}">${ic('x')}</button></div>`).join('')}</div>`;
  },
  developments(d,z){
    return head('Developments',d.meta)+`<div class="rows">${d.rows.slice(0,3).map(r=>devRow(r)).join('')}</div>`;
  },
};
const NAME={since:'Since your last review',summary:'Monitor summary',direction:'Direction of travel',upcoming:'Upcoming',question:'Standing question',watchlist:'Watchlist',developments:'Developments'};
function widget(w,opt={}){
  return `<article class="w z-${w.z}" data-w="${esc(w.t)}${w.id==='dbs-q'?'2':''}" aria-label="${esc(NAME[w.t])}">${BODY[w.t](w.d,w.z,opt)}</article>`;
}

const DBSQ={id:'dbs-q',t:'question',z:'S',d:{l:'Incidents',sub:'DBS',s:'attn',p:'stable',a:'200+ customers sued DBS for ~$17M over Lehman-linked High Notes 5 losses; DBS says suit is without merit, will defend.'}};

function sidebar(o={}){
  const cur=o.cur||'Singapore banks';
  const open=o.open||null;
  const monRow=(label,k,n)=>`<button class="ni" aria-expanded="${open===k}" data-exp="${k}">${ic('right','chev')}${label}<span class="cnt">${n}</span></button>`;
  const sub=(label,cnt,icon)=>`<a class="ni sub${icon?' ico':''}" href="#" ${label===cur?'aria-current="page"':''} ${icon?'style="padding-left:24px"':''}>${icon?ic(icon,'sm'):''}${esc(label)}<span class="cnt">${cnt}</span></a>`;
  return `<nav class="side" aria-label="Main" data-anchor="sidebar"><div class="brand">IntelMonitor</div><div class="nav">
    <div class="nl">Dashboards</div>
    <button class="ni" data-anchor="newdash">${ic('plus')}New dashboard</button>
    ${DASHES.map(([n,c])=>`<a class="ni" href="#" ${n===cur&&!open?'aria-current="page"':''}><span class="dash-dot" style="background:var(--dash-${c})"></span>${esc(n)}</a>`).join('')}
    <div class="nl">Monitors</div>
    ${monRow('Topics','topic',3)}${open==='topic'?TOPICS.map(t=>sub(t[0],t[2],t[1])).join(''):''}
    ${monRow('Groups','group',5)}${open==='group'?GROUPS.map(g=>sub(g[0],g[1])).join(''):''}
    ${monRow('Entities','entity',22)}
  </div><div class="prof pwrap">${o.menu||''}<button aria-haspopup="menu" aria-expanded="${!!o.menu}" data-anchor="profile"><span class="av">A</span><span class="who"><b>Analyst</b><span class="meta">Supervisory analyst</span></span>${ic('up','grow')}</button></div></nav>`;
}
function topbar(){
  return `<header class="top"><label class="search">${ic('search')}<input type="search" aria-label="Search" placeholder="Search subjects, developments and documents"><span class="kbd">⌘K</span></label>
  <div class="trw"><button class="chip" aria-haspopup="dialog" aria-expanded="false"><span class="dot"></span><span><b>Monitoring</b> · Last run 24 Sep</span>${ic('down','chev s12')}</button></div>
  <div class="trw"><button class="bell" aria-label="Alerts">${ic('bell')}</button></div></header>`;
}
function dashPage(opt={}){
  const d=DASH.dash;
  const ws=d.w.slice();ws.push(DBSQ);
  return `<div class="page"><div class="ph1"><div class="grow"><h1 class="ttl"><span class="dash-dot" style="background:var(--dash-blue)"></span>${esc(d.n)}</h1><p>${d.subs.map(s=>`<a href="#">${esc(s)}</a>`).join(', ')}</p></div>
  <button class="btn">${ic('plus')}Add widget</button><button class="btn">Edit</button></div>
  <div class="grid">${ws.map(w=>widget(w,opt)).join('')}</div></div>`;
}

const KEYS=[[['⌘','K'],'Search'],[['?'],'Help'],[['Esc'],'Close a menu, sheet or drawer'],[['←','→'],'Move the focused widget in edit mode'],[['Enter'],"Open the focused widget's settings in edit mode"],[['Delete'],'Remove the focused widget in edit mode']];
function helpBody(){

}
function helpDrawer(){
  return `<aside class="drawer" role="dialog" aria-label="Help"><div class="dh"><h2>Help</h2><button class="ib" aria-label="Close help" style="margin-left:auto">${ic('x')}</button></div>
  <div class="db"><div style="display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line-strong)"><span><b style="font-weight:600">Get started</b> <span class="meta">2 of 5 done</span></span><button class="btn sm" style="margin-left:auto">Show list</button></div>${helpBody()}</div></aside>`;
}
function helpDialog(){
  return `<div class="scrim"></div><div class="dlg" role="dialog" aria-modal="true" aria-label="Help"><div class="mh"><h2>Help</h2><button class="ib" aria-label="Close">${ic('x')}</button></div>
  <div class="body">${helpBody()}</div><div class="mf"><button class="btn">${ic('play')}Replay tour</button><span class="meta">Tour seen 24 Sep</span></div></div>`;
}
function helpPage(){
  return `<div class="page"><div class="ph1"><div class="grow"><h1>Help</h1></div><button class="btn">${ic('play')}Replay overview</button></div>
  <div class="helpdoc"><div class="panel"><div class="hsec"><h3>States</h3>${GLOSS.map(([k,d])=>`<div class="gl2"><span>${badge(k)}</span><span>${esc(d)}</span><span></span></div>`).join('')}</div>
    <div class="hsec"><h3>Materiality</h3>${LEVELS.map(([l,d,n])=>`<div class="gl2"><span class="lvl">${l}</span><span>${esc(d)}</span><span class="meta">${n} this run</span></div>`).join('')}</div></div>
  <div class="panel"><div class="hsec"><h3>Keyboard shortcuts</h3><dl class="keys">${KEYS.map(([c,w])=>`<dt>${c.map(k=>`<kbd class="kbd">${k}</kbd>`).join('')}</dt><dd>${esc(w)}</dd>`).join('')}</dl></div></div></div></div>`;
}
function render(){
  document.querySelectorAll('[data-dir]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.dir===S.dir));
  $('#stepbar').innerHTML=S.dir==='C'?`<button data-view="step" aria-pressed="${S.view==='step'}">Overview</button>`:STEPS.map((_,i)=>`<button data-view="step" data-n="${i+1}" aria-pressed="${S.view==='step'&&S.n===i+1}">Step ${i+1}</button>`).join('');
  document.querySelectorAll('.tb [data-view="menu"],.tb [data-view="help"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===S.view));
  $('#tbd').innerHTML=`<b>${DIRS[S.dir].name}</b><span>${DIRS[S.dir].why}</span>`;
  const step=S.view==='step';
  const showDrawer=step&&S.dir!=='C'&&S.n===3;
  let side=sidebar({menu:S.view==='menu'?menu():''});
  if(S.dir==='B')side=side.replace('<div class="prof pwrap">',checklist()+'<div class="prof pwrap">');
  const main=S.view==='help'&&S.dir==='C'?helpPage():dashPage();
  let over='';
  if(showDrawer)over+=drawer();
  if(S.view==='help'&&S.dir==='A')over+=helpDialog();
  if(S.view==='help'&&S.dir==='B')over+=helpDrawer();
  $('#root').innerHTML=`<div class="app">${S.view==='help'&&S.dir==='C'?side.replace('aria-current="page"',''):side}<main class="main">${topbar()}${main}</main></div>${over}<div id="layer"></div>`;
  requestAnimationFrame(layer);
}
const anchorEl=a=>a==='since'?$('[data-w="since"]'):a==='sidebar'?$('.side .nav'):$(`[data-anchor="${a}"]`);
function rectOf(a){const r=anchorEl(a).getBoundingClientRect();const p=a==='markall'?6:a==='sidebar'?-4:0;return {x:r.left-p,y:r.top-p,w:r.width+2*p,h:r.height+2*p}}
function place(r,w,h){ // popover beside the target: right if room, else left, else below
  const gap=16;let x,y,side;
  if(r.x+r.w+gap+w<innerWidth-16){x=r.x+r.w+gap;side='l'}else if(r.x-gap-w>16){x=r.x-gap-w;side='r'}else{x=r.x;side='t'}
  y=side==='t'?r.y+r.h+gap:Math.min(Math.max(84,r.y+Math.min(r.h/2,80)-40),innerHeight-h-16);
  if(side==='t'&&y+h>innerHeight-16){y=r.y-gap-h;side='b'}
  const cy=side==='l'||side==='r'?Math.min(Math.max(16,r.y+Math.min(r.h/2,80)-y-5),h-26):0;
  return {x,y,side,cy};
}
function layer(){
  const L=$('#layer');if(!L)return;L.innerHTML='';
  if(S.view!=='step')return;
  if(S.dir==='C'){overview(L);return}
  const s=STEPS[S.n-1],r=rectOf(s.a);
  const rad=s.a==='drawer'?0:s.a==='markall'||s.a==='newdash'?6:10;
  L.insertAdjacentHTML('beforeend',`<div class="ring ${S.dir==='A'?'cut':''} acc" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;border-radius:${rad}px"></div>`);
  const w=320,h=S.dir==='A'?176:150,p=place(r,w,h);
  const foot=S.dir==='A'?`<div class="cf"><button class="btn sm gh">Skip tour</button><span class="grow"></span>${S.n>1?'<button class="btn sm" data-prev>Back</button>':''}<button class="btn sm pri" data-next>${S.n===5?'Done':'Next'}</button></div>`
    :`<div class="cf"><span class="meta grow">Ticks off when you do it</span><button class="btn sm" data-next>Got it</button></div>`;
  L.insertAdjacentHTML('beforeend',`<div class="coach" role="dialog" aria-label="${esc(s.t)}" style="left:${p.x}px;top:${p.y}px"><span class="caret ${p.side}" style="${p.side==='l'||p.side==='r'?`top:${p.cy}px`:'left:24px'}"></span>
    <div class="ch2"><span class="meta num">${S.dir==='A'?`${S.n} of 5`:'Get started'}</span><button class="ib" aria-label="Close">${ic('x')}</button></div><h3>${esc(s.t)}</h3><p>${esc(s.b)}</p>${foot}</div>`);
}
function overview(L){
  const T=[['sidebar',STEPS[0]],['since',STEPS[1]],['evq',{t:'Evidence',b:'Every answer and development opens its sources, with the quoted passage highlighted.'}],['markall',STEPS[3]],['newdash',STEPS[4]]];
  const rs=T.map(([a])=>{if(a==='evq'){const el=[...document.querySelectorAll('[data-w="summary"] .qr')][1];const r=el.getBoundingClientRect();return {x:r.left-4,y:r.top-2,w:r.width+8,h:r.height+4}}if(a==='sidebar'){const ns=[...document.querySelectorAll('.side .nav .ni')];const t=ns[1].getBoundingClientRect(),z=ns[ns.length-1].getBoundingClientRect();return {x:t.left,y:t.top+2,w:t.width,h:z.bottom-t.top+2}}return rectOf(a)});
  const holes=rs.map((r,i)=>`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="${i===3||i===4?6:10}" fill="black"/>`).join('');
  L.insertAdjacentHTML('beforeend',`<svg class="ov" width="${innerWidth}" height="${innerHeight}"><defs><mask id="m"><rect width="100%" height="100%" fill="white"/>${holes}</mask></defs><rect y="68" width="100%" height="100%" fill="var(--scrim)" mask="url(#m)"/></svg>`);
  rs.forEach((r,i)=>L.insertAdjacentHTML('beforeend',`<div class="ring acc" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;border-radius:${i===3||i===4?6:10}px"></div><span class="omark" style="left:${r.x+r.w-11}px;top:${i===0?r.y+r.h-11:r.y-11}px">${i+1}</span>`));
  L.insertAdjacentHTML('beforeend',`<div class="ovp" role="dialog" aria-label="Overview"><div class="mh"><h2>How this dashboard works</h2><button class="ib" aria-label="Close">${ic('x')}</button></div>
    <ol>${T.map(([,s],i)=>`<li><span class="n2">${i+1}</span><span><b>${esc(s.t)}</b>${esc(s.b)}</span></li>`).join('')}</ol>
    <div class="mf"><span class="meta grow">Replay from Help in the profile menu</span><button class="btn pri">Got it</button></div></div>`);
}
document.addEventListener('click',e=>{
  const t=e.target;
  const d=t.closest('[data-dir]');if(d){S.dir=d.dataset.dir;render();return}
  const v=t.closest('[data-view]');if(v){S.view=v.dataset.view;if(v.dataset.n)S.n=+v.dataset.n;render();return}
  const g=t.closest('.gs-i');if(g){S.view='step';S.n=+g.dataset.n;render();return}
  if(t.closest('[data-next]')){if(S.n<5){S.n++;render()}return}
  if(t.closest('[data-prev]')){S.n--;render();return}
  if(t.closest('.side .prof > button')){S.view=S.view==='menu'?'step':'menu';render();return}
  if(t.closest('a[href="#"]'))e.preventDefault();
});
addEventListener('resize',()=>layer());
// ?d=A|B|C&v=step|menu|help&n=1..5 sets the view, for screenshots.
const P=new URLSearchParams(location.search);
if(P.get('d'))S.dir=P.get('d');if(P.get('v'))S.view=P.get('v');if(P.get('n'))S.n=+P.get('n');
render();

</script>
</body>
</html>
