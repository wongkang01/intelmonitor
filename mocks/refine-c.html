<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IntelMonitor refine C: Flat sections</title>
<style>
/* Shared tokens (brief section 3), lifted as written. */
:root{
  --canvas:oklch(0.972 0.004 260);
  --surface:oklch(0.993 0.002 260);
  --rail:oklch(0.955 0.005 260);
  --hover:oklch(0.925 0.006 260);
  --line:oklch(0.93 0.005 260);
  --line-strong:oklch(0.885 0.007 260);
  --line-field:oklch(0.80 0.01 260);
  --ink:oklch(0.23 0.012 260);
  --ink2:oklch(0.47 0.014 260);
  --ink3:oklch(0.56 0.012 260);
  --accent:oklch(0.52 0.17 258);
  --accent-strong:oklch(0.46 0.16 258);
  --new:oklch(0.48 0.15 258);--new-bg:oklch(0.955 0.022 250);
  --watch:oklch(0.47 0.105 62);--watch-bg:oklch(0.965 0.035 80);
  --attn:oklch(0.50 0.17 28);--attn-bg:oklch(0.955 0.022 25);
  --stable:oklch(0.47 0.10 155);
  --mark:oklch(0.94 0.07 95);

  /* Direction C, flat sections. Regions are square and unboxed; a rule opens each one. */
  --r-region:0;
  --r-ctl:4px;        /* buttons, inputs, nav items, segmented controls, badges, kbd, popovers */
  --r-float:8px;      /* the two elevated surfaces: evidence drawer, New dashboard popup (the Add widget sheet reuses it) */
  --rule:oklch(0.36 0.012 260);                       /* the 1px rule that opens every region and section */
  --shadow-float:0 8px 24px oklch(0.23 0.012 260 / 0.12); /* the one shallow shadow, always with a 1px --line-strong hairline */
  --backdrop:oklch(0.23 0.012 260 / 0.24);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --col:112px;        /* fixed status column shared by every list */
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font:400 14px/20px var(--font);color:var(--ink);background:var(--surface);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit;margin:0}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
a{color:var(--accent);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
svg.i.s12{width:12px;height:12px}
.grow{flex:1 1 auto}
h1,h2,h3,p{margin:0}

/* Mock toolbar, not part of the design */
.mockbar{height:36px;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--ink);color:var(--surface);font-size:12px;line-height:16px}
.mockbar b{font-weight:600;margin-right:8px}
.mockbar button{height:24px;padding:0 8px;border:1px solid oklch(0.45 0.012 260);border-radius:var(--r-ctl);color:var(--surface)}
.mockbar button[aria-pressed="true"]{background:var(--surface);color:var(--ink);border-color:var(--surface)}
.mockbar .note{margin-left:auto;color:oklch(0.86 0.008 260)}

/* Controls */
.btn{position:relative;display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:var(--r-ctl);font-weight:500;white-space:nowrap;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.ghost:disabled,.btn.ghost:disabled:hover{border-color:transparent;background:transparent}
.btn.link{color:var(--accent)}
.btn.sm{height:28px;padding:0 8px}
.btn:disabled,.btn:disabled:hover{background:var(--surface);border-color:var(--line-strong);color:var(--ink3);cursor:default}
.btn.primary:disabled{background:var(--rail);border-color:var(--line-strong)}
.btn::after,.ib::after{content:"";position:absolute;inset:-6px 0}
.ib{position:relative;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:var(--r-ctl);color:var(--ink2);flex:none}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib.box{border:1px solid var(--line-strong);background:var(--surface);width:24px;height:24px}
.ib.box::after{inset:-10px}
.field{height:32px;display:flex;align-items:center;gap:8px;padding:0 8px;border:1px solid var(--line-field);border-radius:var(--r-ctl);background:var(--surface);color:var(--ink3);flex-shrink:0}
.field input{border:0;background:transparent;outline:none;flex:1;min-width:0;height:100%;color:var(--ink)}
.field input::placeholder,textarea::placeholder{color:var(--ink3)}
.field:focus-within{outline:2px solid var(--accent);outline-offset:2px}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none}
textarea.ta{width:100%;min-height:72px;resize:vertical;padding:8px;border:1px solid var(--line-field);border-radius:var(--r-ctl);background:var(--surface);color:var(--ink)}
textarea.ta:focus-visible{outline-offset:2px}
kbd{font:500 12px/16px var(--font);color:var(--ink2);padding:0 4px;border:1px solid var(--line-strong);border-radius:var(--r-ctl);background:var(--surface)}
.seg{display:inline-flex;height:28px;padding:2px;background:var(--rail);border-radius:var(--r-ctl);gap:2px}
.seg button{height:24px;padding:0 8px;border-radius:3px;border:1px solid transparent;color:var(--ink2);font-weight:500;display:inline-flex;align-items:center;gap:4px;position:relative}
.seg button::after{content:"";position:absolute;inset:-8px 0}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 4px;border-radius:var(--r-ctl);font-size:12px;line-height:16px;font-weight:500;background:var(--rail);color:var(--ink2);vertical-align:1px}
/* Status words: the status mark in every list. Word only, no fill, no dot. */
.sw{font-size:12px;line-height:20px;font-weight:600}
.s-attn{color:var(--attn)}.s-watch{color:var(--watch)}.s-new{color:var(--new)}.s-stable{color:var(--stable)}.s-upd{color:var(--ink2)}

/* Shell */
.app{height:calc(100vh - 36px);display:grid;grid-template-columns:232px minmax(0,1fr);position:relative}
nav.side{background:var(--rail);display:flex;flex-direction:column;min-height:0}
.brand{height:56px;display:flex;align-items:center;padding:0 20px;font-weight:600;letter-spacing:-0.01em;flex:none}
.navscroll{flex:1;overflow:auto;padding:8px 12px 16px}
.nh{font-size:12px;line-height:16px;font-weight:500;color:var(--ink2);padding:16px 8px 8px}
.nh:first-child{padding-top:4px}
.ni{position:relative;display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:var(--r-ctl);font-weight:500;color:var(--ink);white-space:nowrap}
.ni:hover{background:var(--hover)}
.ni[aria-current="page"]{background:var(--surface);font-weight:600;box-shadow:inset 0 0 0 1px var(--line-strong)}
.ni .cnt{margin-left:auto;font-size:12px;font-weight:400;color:var(--ink2)}
.ni svg{color:var(--ink3)}
.ni.sub{height:28px;padding-left:32px;font-weight:400}
.ni.sub[aria-current="page"]{font-weight:600}
.prof{position:relative;display:flex;align-items:center;gap:8px;height:56px;padding:0 20px;border-top:1px solid var(--line-strong);flex:none;width:100%}
.prof:hover{background:var(--hover)}
.av{width:28px;height:28px;border-radius:50%;background:var(--hover);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.prof .pn{display:flex;flex-direction:column;line-height:16px;flex:1}
.prof .pn b{font-weight:500;font-size:14px;line-height:20px}
.prof .pn span{font-size:12px;color:var(--ink2)}
.prof svg{color:var(--ink3)}
main.main{min-width:0;overflow:auto;position:relative;background:var(--surface)}
.top{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:8px;padding:0 48px;background:var(--surface);border-bottom:1px solid var(--line)}
.search{flex:1 1 auto;max-width:720px}
.search svg{color:var(--ink3)}
.wrap{position:relative;flex:none}
.runchip{position:relative;display:flex;align-items:center;gap:8px;height:32px;min-width:252px;padding:0 12px;border:1px solid var(--line-strong);border-radius:var(--r-ctl);background:var(--surface);color:var(--ink2);white-space:nowrap}
.runchip b{font-weight:600;color:var(--ink)}
.runchip:hover,.runchip[aria-expanded="true"],.bell:hover,.bell[aria-expanded="true"]{background:var(--hover)}
.runchip .chev{margin-left:auto;color:var(--ink3);transition:transform .15s ease-out}
.runchip[aria-expanded="true"] .chev{transform:rotate(180deg)}
.runchip::after,.bell::after{content:"";position:absolute;inset:-7px 0}
.dot{width:6px;height:6px;border-radius:50%;background:var(--stable);flex:none}
.runmark{width:8px;height:8px;flex:none;color:var(--new)}
.bell{position:relative;display:flex;align-items:center;gap:4px;height:32px;min-width:32px;padding:0 7px;border:1px solid var(--line-strong);border-radius:var(--r-ctl);background:var(--surface);color:var(--ink2)}
.cntb{height:16px;padding:0 4px;border-radius:var(--r-ctl);font-size:12px;line-height:16px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--attn-bg);color:var(--attn)}
.cntb.w{background:var(--watch-bg);color:var(--watch)}

/* Popovers: anchored to a control, so control radius, one hairline, one shallow shadow */
.pop{position:absolute;right:0;top:calc(100% + 8px);width:400px;max-height:min(560px,calc(100vh - 96px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-ctl);box-shadow:var(--shadow-float);z-index:40}
.pop-head{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;border-bottom:1px solid var(--line)}
.pop-head b{font-weight:600}
.cap{font-size:12px;line-height:16px;color:var(--ink2)}
.pop-head .btn{margin-left:auto}
.pop-body{overflow:auto;flex:1}
.pop-foot{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-top:1px solid var(--line)}
.pop-foot .btn{margin-left:auto}
.run-row{display:grid;grid-template-columns:16px minmax(0,1fr) auto;column-gap:12px;padding:8px 16px;border-top:1px solid var(--line)}
.run-row:first-child{border-top:0}
.run-row:hover{background:var(--hover)}
.run-row .st{height:20px;display:flex;align-items:center}
.run-row .st svg{width:12px;height:12px}
.run-row .w{font-weight:500}
.run-row .w.now{font-weight:600}
.run-row .m{font-size:12px;line-height:16px;color:var(--ink2);margin-top:4px}
.run-row .res{font-size:12px;line-height:20px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.pgl{padding:12px 16px 4px;font-size:12px;line-height:16px;font-weight:500;color:var(--ink2)}
.pgl .sw{font-size:12px;line-height:16px}
.pop .row{padding:8px 16px;border-top:1px solid var(--line)}
.pop .pgl + .row{border-top:0}
.pop .row:hover,.pop .row:focus-visible{background:var(--hover)}

/* Page */
.page{padding:40px 48px 64px}
.ph{display:flex;align-items:flex-start;gap:8px;margin-bottom:40px}
.ph h1{font-size:24px;line-height:30px;font-weight:600;letter-spacing:-0.01em}
.ph .meta{margin-top:4px;color:var(--ink2)}
.ph .meta a{color:var(--ink2)}
.ph .meta a:hover{color:var(--ink)}
.ph .acts{margin-left:auto;display:flex;gap:8px}

/* Widget grid: regions, not cards. A rule opens each region; whitespace separates them. */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:232px;grid-auto-flow:row dense;gap:48px 32px}
.grid.fixed{width:1112px;grid-template-columns:repeat(4,254px)}
.rg{position:relative;min-width:0;display:flex;flex-direction:column;border-top:1px solid var(--rule);padding-top:12px;overflow:hidden;border-radius:var(--r-region)}
.rg.S{grid-column:span 1}.rg.M{grid-column:span 2}.rg.L{grid-column:span 2;grid-row:span 2}
.rh{display:flex;align-items:baseline;gap:8px;min-height:20px;margin-bottom:8px}
.rt{font-weight:600;color:var(--ink2);white-space:nowrap}
a.rt:hover{color:var(--ink);text-decoration:underline}
.rm{margin-left:auto;font-size:12px;line-height:16px;color:var(--ink2);white-space:nowrap}
.rg.S .rh{flex-direction:column;gap:0}
.rg.S .rm{margin-left:0}
.lead{font-size:18px;line-height:24px;font-weight:600}
.ans{font-weight:600}
.cap14{color:var(--ink)}
.meta12{font-size:12px;line-height:16px;color:var(--ink2)}
.rfoot{margin-top:auto;padding-top:8px;display:flex;gap:16px;align-items:baseline;font-size:12px;line-height:16px;color:var(--ink2)}
.rfoot a{font-weight:500}
.rfoot .r{margin-left:auto}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.clamp4{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}

/* The one list-row grammar: status column, title, meta, right-aligned date */
.row{display:grid;grid-template-columns:var(--col) minmax(0,1fr) auto;column-gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;color:inherit}
.row.nost{grid-template-columns:minmax(0,1fr) auto}
.row .tt{font-weight:500}
.row:hover .tt{text-decoration:underline;text-decoration-color:var(--ink3)}
.row .mt{font-size:12px;line-height:16px;color:var(--ink2);margin-top:4px}
.row .dt{font-size:12px;line-height:20px;color:var(--ink2);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.gl{margin-top:16px;padding-bottom:8px;font-size:12px;line-height:16px;font-weight:500;color:var(--ink2)}
.gl .sw{line-height:16px}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:32px}
.sumrow{display:flex;gap:12px;justify-content:space-between;align-items:baseline;padding:12px 0;border-top:1px solid var(--line)}
.sumrow .l{color:var(--ink2);white-space:nowrap}
.sumrow .v{font-weight:600;text-align:right}
.tr{font-weight:600}
.tr .arr{color:var(--ink2);font-weight:400}
.tr>span{white-space:nowrap}
.spark{display:block;width:100%;height:56px;margin:8px 0;color:var(--ink2)}
.spark .last{fill:var(--ink)}
.wl-row{display:grid;grid-template-columns:var(--col) minmax(0,1fr) 28px;column-gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.wl-row .n{font-weight:500}
.wl-row .ib{margin-top:-4px}
.addf{margin-bottom:12px}

/* Edit mode: the region outline is drawn only while editing */
.editing .rg{overflow:visible;outline:1px dashed var(--accent);outline-offset:8px;border-radius:var(--r-ctl);cursor:grab}
.editing .rg .rm{visibility:hidden}
.minus{position:absolute;top:10px;right:0;z-index:2}
.rg.changed{outline:1px solid var(--accent);outline-offset:8px;border-radius:var(--r-ctl)}

/* Monitor page: sections on one surface */
.mon{max-width:800px}
.sec{border-top:1px solid var(--rule);padding-top:12px;margin-bottom:48px}
.sh{display:flex;align-items:baseline;gap:8px;margin-bottom:16px}
.sh h2{font-size:18px;line-height:24px;font-weight:600}
.sh .rm{margin-left:auto}
.summ{font-weight:600}
.sub12{font-size:12px;line-height:16px;color:var(--ink2);margin-top:4px;margin-bottom:12px}
.q-row{display:grid;grid-template-columns:var(--col) minmax(0,1fr);column-gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.q-row .st{font-size:12px;line-height:20px;font-weight:600}
.q-row .lab{font-weight:500}
.q-row .qq{font-size:12px;line-height:16px;color:var(--ink2);margin-top:4px;max-width:70ch}
.q-row .aa{margin-top:8px;max-width:70ch}
.q-row .mm{font-size:12px;line-height:16px;color:var(--ink2);margin-top:4px}
.q-row .mm a{font-weight:500}
.more{display:flex;gap:16px;align-items:baseline;padding-top:12px;border-top:1px solid var(--line);font-size:12px;line-height:16px;color:var(--ink2)}
.more a{font-size:14px;line-height:20px;font-weight:500}
dl.links{display:grid;grid-template-columns:var(--col) minmax(0,1fr);column-gap:12px;margin:0}
dl.links dt,dl.links dd{padding:12px 0;border-top:1px solid var(--line);margin:0}
dl.links dt{font-size:12px;line-height:20px;font-weight:500;color:var(--ink2)}
dl.links dd a{color:var(--ink)}
.actrow{display:flex;align-items:center;gap:12px}
.notebox{margin-top:16px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:560px}

/* Elevated surfaces: evidence drawer and New dashboard popup. 8px, one hairline, one shallow shadow. */
.float{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-float);box-shadow:var(--shadow-float);display:flex;flex-direction:column;overflow:hidden}
.drawer{position:absolute;top:64px;right:8px;bottom:8px;width:520px;z-index:15}
.fhead{height:48px;flex:none;display:flex;align-items:center;gap:16px;padding:0 12px 0 24px;border-bottom:1px solid var(--line)}
.fhead h2{font-size:18px;line-height:24px;font-weight:600}
.fhead .ib{margin-left:auto}
.dbody{flex:1;overflow:auto;padding:16px 24px 32px}
.dl{font-size:12px;line-height:16px;font-weight:500;color:var(--ink2)}
.dsec{border-top:1px solid var(--rule);padding-top:12px;margin-top:32px}
.src{padding:12px 0;border-top:1px solid var(--line)}
.src .t{font-weight:500;color:var(--ink)}
.src .p{margin-top:8px;max-width:70ch}
mark{background:var(--mark);color:var(--ink);border-radius:var(--r-ctl);padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.scrim{position:fixed;inset:36px 0 0 0;background:var(--backdrop);z-index:50;display:flex;align-items:center;justify-content:center}
.popup{width:min(1152px,calc(100vw - 96px));height:min(720px,calc(100vh - 36px - 96px))}
.pbody{flex:1;min-height:0;display:flex;flex-direction:column}
.pfoot{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 24px;border-top:1px solid var(--line)}
.pfoot label{font-size:12px;line-height:16px;font-weight:500;color:var(--ink2)}
.pfoot .field{width:240px}
.gal{flex:1;min-height:0;display:grid;grid-template-columns:240px minmax(0,1fr)}
.subjects{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:16px 12px 0}
.subjects .list{overflow:auto;flex:1;padding-top:8px;padding-bottom:16px;margin:0 -4px;padding-left:4px;padding-right:4px}
.subj{position:relative;display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:var(--r-ctl)}
.subj:hover{background:var(--rail)}
.subj[aria-current="true"]{background:var(--hover);font-weight:600}
.subj .cnt{margin-left:auto;font-size:12px;color:var(--ink2);font-weight:400;font-variant-numeric:tabular-nums}
.offers{overflow:auto;padding:16px 32px 32px}
.ohead{display:flex;align-items:baseline;gap:12px}
.ohead h3{font-size:18px;line-height:24px;font-weight:600}
.back{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:16px;font-weight:500;margin-bottom:12px;position:relative}
.back::after{content:"";position:absolute;inset:-14px -4px}
.ogl{margin-top:24px;font-size:12px;line-height:16px;font-weight:500;color:var(--ink2)}
.offer{display:grid;grid-template-columns:200px minmax(0,1fr);column-gap:32px;padding:24px 0;border-bottom:1px solid var(--line)}
.ogl + .offer{padding-top:12px}
.offer .on{font-weight:500}
.offer .oc{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.prev{pointer-events:none}
.prev .rg{height:100%}
.prev.S{width:254px;height:232px}.prev.M{width:540px;height:232px}.prev.L{width:540px;height:512px}
.canvas{flex:1;min-height:0;display:flex;flex-direction:column}
.chead{height:48px;flex:none;display:flex;align-items:center;gap:12px;padding:0 24px}
.chead b{font-weight:600}
.cscroll{flex:1;overflow:auto;padding:16px 24px 24px}
.fit{transform-origin:0 0}
.gen{flex:1;min-height:0;display:flex;flex-direction:column}
.reply{flex:none;display:flex;align-items:baseline;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line)}
.reply details{font-size:12px;line-height:16px;color:var(--ink2)}
.reply summary{cursor:pointer;color:var(--accent);font-weight:500;list-style:none;display:inline}
.reply summary::-webkit-details-marker{display:none}

// ---------- Rows ----------
function rowHTML(r,{status=true,date=true}={}){
  return `<button class="row${status?'':' nost'}" data-ev="${r.id}">${status?`<span>${sw(r.s)}</span>`:''}<span><span class="tt clamp2">${esc(r.t)}</span><span class="mt" style="display:block">${esc(r.m)}</span></span>${date?`<span class="dt">${esc(r.d)}</span>`:'<span></span>'}</button>`;
}

// ---------- Widgets (regions) ----------
function spark(weeks){
  const w=240,h=56,max=Math.max(...weeks),n=weeks.length;
  const pts=weeks.map((v,i)=>[+(i*(w-8)/(n-1)+4).toFixed(1),+(h-6-(v/max)*(h-14)).toFixed(1)]);
  const l=pts[n-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/><circle class="last" cx="${l[0]}" cy="${l[1]}" r="2.5"/></svg>`;
}
function body(w){
  const d=w.d,sz=w.size;
  switch(w.type){
  case 'since':{
    const attn=d.rows.filter(r=>r.s==='attn'),rest=d.rows.filter(r=>r.s!=='attn');
    const cap=sz==='L'?4:1;
    let rows=attn.slice(0,cap),html=`<p class="lead num">${d.newc} new, ${d.attn} need${d.attn===1?'s':''} attention</p>`;
    if(rows.length)html+=`<div class="gl">${sw('attn')} · <span class="num">${d.attn}</span></div>${rows.map(r=>rowHTML(r,{status:false})).join('')}`;
    if(rows.length<cap){const more=rest.slice(0,cap-rows.length);html+=`<div class="gl">${sw('new')} · <span class="num">${d.newc-d.attn}</span></div>${more.map(r=>rowHTML(r,{status:false})).join('')}`;}
    return html+`<div class="rfoot"><a>Show all ${d.newc}</a><a>Mark all reviewed</a><span class="r num">${d.upd?d.upd+' updated, ':''}${d.qchg} answers changed</span></div>`;}
  case 'summary':{
    const a=sz==='L'?d.answers:d.answers.slice(0,6);
    const ch=d.answers.filter(x=>x.prev).length;
    return `<div class="sumgrid">${a.map(x=>`<a class="sumrow" data-q="${x.id}"><span class="l">${esc(x.label)}</span><span class="v">${stateTxt(x.state,x.prev)}</span></a>`).join('')}</div><div class="rfoot"><a>Open ${esc(w.scope)}</a><span class="r num">${d.answers.length} questions, ${ch} changed</span></div>`;}
  case 'direction':{
    const word=d.trend[0].toUpperCase()+d.trend.slice(1);
    return `<p class="ans">${word}</p>${spark(d.weeks)}<p class="cap14">${esc(d.caption)}</p>`;}
  case 'upcoming':{
    const it=d.items.slice(0,sz==='M'?3:1);
    return it.map(x=>`<p class="ans num">${esc(x.date)}</p><p class="cap14 clamp3" style="margin-top:4px">${esc(x.label)}</p><p class="meta12" style="margin-top:8px">In ${x.days} days</p>`).join('');}
  case 'watchlist':
    return `<label class="field addf">${ic('plus')}<input aria-label="Add to watchlist" placeholder="Add a bank, central bank, issuer or country"></label>`+
      d.entries.map(e=>`<div class="wl-row"><span>${sw(e.state)}</span><div><a class="n" style="color:var(--ink)">${esc(e.name)}</a><div class="clamp2" style="margin-top:4px">${esc(e.hl)}</div>${sz==='L'&&e.latest?`<div class="meta12 clamp2" style="margin-top:4px">Latest, ${esc(e.latest.d)}: ${esc(e.latest.t)}</div>`:''}</div><button class="ib" aria-label="Remove ${esc(e.name)}">${ic('x')}</button></div>`).join('');
  case 'developments':{
    const n=sz==='L'?5:2;
    return d.rows.slice(0,n).map(r=>rowHTML(r)).join('')+`<div class="rfoot"><a>Show all ${esc(w.scope.split(' ')[0])}</a></div>`;}
  case 'question':
    return `<p>${stateTxt(d.state,d.prev)}</p><p class="cap14 clamp4" style="margin-top:4px">${esc(d.sum)}</p><div class="rfoot"><a>See evidence</a><span>last ${d.lb} days</span></div>`;
  }
}
function title(w){return w.type==='question'?w.d.label:NAME[w.type];}
function region(w,{edit=false,changed=false}={}){
  return `<section class="rg ${w.size}${changed?' changed':''}" data-id="${w.id||''}" aria-label="${esc(title(w))}">
    <div class="rh"><a class="rt">${esc(title(w))}</a><span class="rm">${esc(w.scope)}</span></div>
    ${edit?`<button class="ib box minus" data-remove="${w.id}" aria-label="Remove ${esc(title(w))}">${ic('minus','i s12')}</button>`:''}
    ${body(w)}</section>`;
}

  $('runs').innerHTML=`<div class="pop-head"><b>Runs</b><span class="cap">Weekly, Thursday 04:00</span></div>
   <div class="pop-body">${live}
    <div class="run-row"><span class="st s-watch"><svg class="i" style="stroke-width:2"><use href="#i-excl"/></svg><span class="sr">Completed with alerts</span></span><div><div class="w">Today, 04:01</div><div class="m">Scheduled · ${r0.dur} · ${src} sources</div></div><span class="res"><span class="num">${r0.res[0]}</span> new, <span class="s-attn num">${r0.res[1]} need attention</span></span></div>
    <div class="run-row"><span class="st s-stable"><svg class="i" style="stroke-width:2"><use href="#i-check"/></svg><span class="sr">Completed</span></span><div><div class="w">Run of 17 Sep</div><div class="m">Scheduled · ${r1.dur} · ${src} sources</div></div><span class="res">First run, <span class="num">${r1.devs}</span> developments</span></div>
   </div>
   <div class="pop-foot"><span class="cap">Next scheduled run: 1 Oct, 04:00</span><button class="btn sm" id="run-now" ${S.running?'disabled':''}>${S.running?'Running…':'Run now'}</button></div>`;
}
function renderAlerts(){
  const A=DATA.alerts,unread=S.alertsRead?0:A.length,hasAttn=A.some(a=>a.s==='attn');
  $('bell').innerHTML=ic('bell')+(unread?`<span class="cntb${hasAttn?'':' w'}" aria-hidden="true">${unread}</span>`:'');
  $('bell').setAttribute('aria-label',unread?`Alerts, ${unread} unread`:'Alerts');
  const at=A.filter(a=>a.s==='attn'),wt=A.filter(a=>a.s==='watch');
  const grp=(s,l)=>l.length?`<div class="pgl">${sw(s)} · <span class="num">${l.length}</span></div>${l.map(r=>rowHTML(r,{status:false})).join('')}`:'';
  $('alerts').innerHTML=`<div class="pop-head"><b>Alerts</b><span class="cap">${unread?unread+' unread':'All read'}</span><button class="btn ghost sm link" id="mark-read" ${unread?'':'disabled'}>Mark all read</button></div>
   <div class="pop-body">${grp('attn',at)}${grp('watch',wt)}</div>`;
}
function setPop(which,open){
  const p=$(which),t=$(which==='runs'?'runchip':'bell');
  p.hidden=!open;t.setAttribute('aria-expanded',open);
  if(open)setPop(which==='runs'?'alerts':'runs',false);
}
$('runchip').onclick=()=>setPop('runs',$('runs').hidden);
$('bell').onclick=()=>setPop('alerts',$('alerts').hidden);
$('runs').addEventListener('click',e=>{e.stopPropagation();if(e.target.closest('#run-now')&&!S.running){S.running=true;renderRuns();}});
$('alerts').addEventListener('click',e=>{e.stopPropagation();if(e.target.closest('#mark-read')){S.alertsRead=true;renderAlerts();}else if(e.target.closest('[data-ev]')){setPop('alerts',false);openDrawer();}});
document.addEventListener('click',e=>{
  if(!$('runs').hidden&&!e.target.closest('#runs-wrap'))setPop('runs',false);
  if(!$('alerts').hidden&&!e.target.closest('#alerts-wrap'))setPop('alerts',false);
});

// ---------- Dashboard ----------
function renderDash(){
  const ed=S.editing;
  $('page').innerHTML=`<div class="ph"><div><h1>Singapore banks</h1><p class="meta">${ed?'Drag to reorder. Click a widget for settings.':'<a href="#">Singapore banks</a>, <a href="#">Banking regulation</a>'}</p></div>
    <div class="acts"><button class="btn" id="add-w">${ic('plus')}Add widget</button><button class="btn${ed?' primary':''}" id="edit">${ed?'Done':'Edit'}</button></div></div>
    <div class="grid${ed?' editing':''}" id="grid">${S.widgets.map(w=>region(w,{edit:ed})).join('')}</div>`;
  $('edit').onclick=()=>{S.editing=!S.editing;renderDash();};
  $('add-w').onclick=()=>{S.editing=true;S.sheet=true;renderDash();renderOverlay();};
  $('grid').onclick=e=>{
    const rm=e.target.closest('[data-remove]');
    if(rm){const i=S.widgets.findIndex(w=>w.id===rm.dataset.remove);S.removed={w:S.widgets[i],i};S.widgets.splice(i,1);renderDash();toast(`Removed ${title(S.removed.w)}`);return;}
    if(!S.editing&&e.target.closest('[data-ev]'))openDrawer();
  };
}
function toast(msg){
  const t=$('toast');t.hidden=false;t.innerHTML=`<span>${esc(msg)}</span><button class="btn sm" id="undo">Undo</button>`;
  $('undo').onclick=()=>{S.widgets.splice(S.removed.i,0,S.removed.w);t.hidden=true;renderDash();const el=document.querySelector(`[data-id="${S.removed.w.id}"]`);el&&el.classList.add('changed');};
  clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,6000);
}

// ---------- Monitor page (OCBC) ----------
function renderMonitor(){
  const p=DATA.page,parts=[`${p.newc} new`];if(p.upd)parts.push(`${p.upd} updated`);if(p.attn)parts.push(`${p.attn} need${p.attn===1?'s':''} attention`);
  const qs=p.questions,changed=qs.filter(q=>q.prev).length;
  const links=Object.entries(p.links).map(([k,v])=>`<dt>${k[0].toUpperCase()+k.slice(1)}</dt><dd>${v.map(n=>`<a href="#">${esc(n)}</a>`).join(', ')}</dd>`).join('');
  $('page').innerHTML=`<div class="mon">
   <div class="ph"><div><h1>${esc(p.name)}</h1><p class="meta">Bank in <a href="#">Singapore banks</a> · ${esc(p.domain)}</p></div></div>
   <section class="sec"><div class="sh"><h2>What changed</h2><span class="rm">Run of 24 Sep against 17 Sep</span></div>
     <p class="summ num">${parts.join(', ')}</p><p class="sub12">${changed} answers changed. You marked this reviewed ${esc(p.reviewed)}.</p>
     ${p.rows.slice(0,6).map(r=>rowHTML(r)).join('')}
     <div class="more"><a>Show all ${p.newc}</a></div></section>
   <section class="sec"><div class="sh"><h2>Standing questions</h2><span class="rm">${qs.length} questions, ${changed} changed</span></div>
     ${qs.map(q=>`<div class="q-row"><span class="st">${stateTxt(q.state,q.prev)}</span><div><div class="lab">${esc(q.label)}${q.custom?' <span class="badge">Custom</span>':''}</div><div class="qq">${esc(q.q)}</div><p class="aa">${esc(q.sum)}</p><div class="mm">${q.nd?`<a data-evq="${q.id}">See evidence</a>`:'No sources'} · last ${q.lb} days${q.custom?' · <a>Edit</a>':''}</div></div></div>`).join('')}
     <div class="more"><a>Add a question</a><span>${p.slots} custom questions left</span></div></section>
   <section class="sec"><div class="sh"><h2>Links</h2><span class="rm"><a>Open graph view</a></span></div><dl class="links">${links}</dl></section>
   <section class="sec"><div class="sh"><h2>Actions</h2></div>
     <div class="actrow"><button class="btn primary">Mark reviewed</button><span class="meta12">Reviewed ${esc(p.reviewed)}</span></div>
     <div class="notebox"><textarea class="ta" aria-label="Add a note" placeholder="Add a note"></textarea><button class="btn sm" disabled>Add note</button></div></section>
  </div>`;
  $('page').onclick=e=>{if(e.target.closest('[data-evq],[data-ev]'))openDrawer();};
}

// ---------- Evidence drawer ----------
function passage(p){return (p.pre?'… ':'')+p.parts.map(([k,t])=>k?`<mark>${esc(t)}</mark>`:esc(t)).join('')+(p.post?' …':'');}
function openDrawer(){S.drawer=true;renderDrawer();}
function renderDrawer(){
  const d=DATA.ev,dr=$('drawer');dr.hidden=!S.drawer;if(!S.drawer)return;
  const nsrc=d.findings.reduce((a,f)=>a+f.srcs.length,0);
  dr.innerHTML=`<div class="fhead"><h2>${esc(d.label)}</h2><span class="meta12">${esc(d.subject)} · last ${d.lb} days</span><button class="ib" id="dclose" aria-label="Close evidence">${ic('x')}</button></div>
   <div class="dbody">
    <p class="meta12">${esc(d.q)}</p>
    <p style="margin-top:12px">${stateTxt(d.state,d.prev)}</p>
    <p style="margin-top:4px;max-width:70ch">${esc(d.sum)}</p>
    <p class="meta12" style="margin-top:8px">Last run: ${esc(d.prevsum)}</p>
    ${d.findings.map((f,i)=>`<div class="dsec"><div class="dl">Finding ${i+1} of ${d.findings.length}</div>
      <div class="row nost" style="border-top:0;padding-bottom:4px"><span><span style="display:block">${sw(f.s)}</span><span class="tt" style="display:block">${esc(f.t)}</span><span class="mt" style="display:block">${esc(f.mat)} · ${esc(f.cat)} · ${esc(f.d)}</span><span class="mt" style="display:block" title="${esc(f.sub.map(c=>c.subject.name+' '+Math.round(c.confidence*100)+'%').join(', '))}, materiality ${Math.round(f.matconf*100)}%">Tagged to ${esc(f.tags.join(', '))} · ${f.conf} confidence</span></span><span></span></div>
      ${f.srcs.map(s=>`<div class="src"><a class="t" href="#">${esc(s.t)}</a><div class="meta12" style="margin-top:4px">${esc(s.m)}</div><p class="p">${passage(s.p)}</p></div>`).join('')}</div>`).join('')}
    <div class="dsec"><div class="dl" style="margin-bottom:8px">Notes</div><textarea class="ta" aria-label="Add a note" placeholder="Add a note"></textarea><div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn sm" disabled>Add note</button></div></div>
   </div>`;
  $('dclose').onclick=()=>{S.drawer=false;renderDrawer();};
}

// ---------- Gallery (Add widget sheet and popup Build tab share it) ----------
const OFFERS={topic:[['since','L'],['direction','S'],['upcoming','S'],['summary','M'],['developments','M'],['question','S']],
  group:[['since','L'],['watchlist','L'],['summary','M'],['developments','M'],['direction','S'],['upcoming','S'],['question','S']],
  entity:[['summary','M'],['question','S'],['since','M'],['developments','M'],['watchlist','M'],['direction','S'],['upcoming','S']]};
function offersFor(name){
  if(name==='OCBC')return OFFERS.entity.map(([t,z])=>({...DATA.ocbcW[t],size:S.gsizes[name+t]||z}));
  const g=Object.fromEntries(DATA.galSgb.map(w=>[w.type,w]));
  return OFFERS.group.filter(([t])=>g[t]).map(([t,z])=>({...g[t],size:S.gsizes[name+t]||z}));
}
function galleryHTML(name,inPopup){
  const kind=name==='OCBC'?'Entity, bank':'Group';
  const off=offersFor(name);
  const offer=o=>`<div class="offer"><div class="oc"><div><div class="on">${CAT_NAME[o.type]}</div><div class="meta12" style="margin-top:4px">${SIZE_LABEL[o.size]}, ${FOOT[o.size]}</div></div>
     <div class="seg" role="group" aria-label="${CAT_NAME[o.type]} size">${SIZES[o.type].map(z=>`<button data-gsize="${name}|${o.type}|${z}" aria-pressed="${o.size===z}">${SIZE_LABEL[z]}</button>`).join('')}</div>
     <button class="btn sm" data-add="${o.type}">${ic('plus')}Add</button></div>
     <div class="prev ${o.size}">${region(o)}</div></div>`;
  const sec=(label,list)=>`<div class="nh" style="padding-left:8px">${label}</div>${list.map(([n,c])=>`<button class="subj" data-subj="${esc(n)}" aria-current="${n===name}">${esc(n)}${c?`<span class="cnt">${c} new</span>`:''}</button>`).join('')}`;
  return `<div class="gal"><div class="subjects"><label class="field">${ic('search')}<input type="search" aria-label="Filter subjects" placeholder="Search subjects"></label>
      <div class="list">${sec('Topics',DATA.subjects.topic)}${sec('Groups',DATA.subjects.group)}${sec('Entities',DATA.subjects.entity)}</div></div>
    <div class="offers">${inPopup?`<a class="back" id="back">${ic('left','i s12')}Back to preview</a>`:''}
      <div class="ohead"><h3>${esc(name)}</h3><span class="meta12">${kind}</span></div>
      <div class="ogl">Suggested</div>${off.slice(0,2).map(offer).join('')}
      <div class="ogl">More widgets</div>${off.slice(2).map(offer).join('')}</div></div>`;
}
function fitGrids(root){
  root.querySelectorAll('.fit').forEach(f=>{const box=f.parentElement,s=Math.min(1,(box.clientWidth)/1112);f.style.transform=`scale(${s})`;f.parentElement.style.height=(f.scrollHeight*s)+'px';});
}

// ---------- Overlays: Add widget sheet and New dashboard popup ----------
function renderOverlay(){
  const sc=$('scrim');
  if(S.sheet){
    sc.hidden=false;
    sc.innerHTML=`<div class="float popup" role="dialog" aria-modal="true" aria-labelledby="sheet-t"><div class="fhead"><h2 id="sheet-t">Add widget</h2><span class="meta12">to Singapore banks</span><button class="ib" id="pclose" aria-label="Close">${ic('x')}</button></div>
      <div class="pbody">${galleryHTML(S.sheetSubject,false)}</div></div>`;
  }else if(S.popup){
    sc.hidden=false;
    const d=S.draft,n=d.length;
    let body='';
    if(S.popup==='build'){
      body=S.gallery?galleryHTML(S.subject,true):`<div class="canvas"><div class="chead"><b>Preview</b><span class="meta12">Drag to reorder</span><button class="btn sm" id="open-gal" style="margin-left:auto">${ic('plus')}Add widget</button></div>
        <div class="cscroll"><div><div class="fit"><div class="grid fixed editing">${d.map((w,i)=>region(w,{edit:true,changed:i===n-1})).join('')}</div></div></div></div></div>`;
    }else{
      const g=DATA.ocbcW,gen=['summary','since','question','direction','developments','watchlist','upcoming'].map((t,i)=>({...g[t],id:'g'+i}));
      body=`<div class="gen"><div class="reply"><span style="font-weight:500">Added 7 widgets for OCBC</span><details><summary>Details</summary><ul>${gen.map(w=>`<li>Added ${CAT_NAME[w.type]}, ${SIZE_LABEL[w.size].toLowerCase()}</li>`).join('')}</ul></details></div>
        <div class="cscroll"><div><div class="fit"><div class="grid fixed">${gen.map(w=>region(w)).join('')}</div></div></div></div>
        <form class="dock" onsubmit="return false"><label class="field">${ic('spark')}<input aria-label="Ask for a change" placeholder="Ask for a change, e.g. remove the watchlist"></label><button class="btn" aria-label="Send">${ic('up')}</button></form></div>`;
    }
    const foot=S.popup==='gen'
      ?`<span class="meta12">7 widgets pending</span><button class="btn ghost sm">Undo</button><button class="btn sm">Keep</button><span class="grow"></span><button class="btn primary" disabled>Create dashboard</button>`
      :`<label for="pname">Name</label><span class="field"><input id="pname" value="OCBC"></span><span class="grow"></span><span class="meta12 num">${n} widget${n===1?'':'s'}</span><button class="btn primary" ${n?'':'disabled'}>Create dashboard</button>`;
    sc.innerHTML=`<div class="float popup" role="dialog" aria-modal="true" aria-labelledby="pop-t"><div class="fhead"><h2 id="pop-t">New dashboard</h2>
      <div class="seg" role="tablist" aria-label="How to build"><button role="tab" id="t-build" aria-selected="${S.popup==='build'}">Build</button><button role="tab" id="t-gen" aria-selected="${S.popup==='gen'}">${ic('spark','i s12')}Generate</button></div>
      <button class="ib" id="pclose" aria-label="Close">${ic('x')}</button></div>
      <div class="pbody">${body}</div><div class="pfoot">${foot}</div></div>`;
    $('t-build').onclick=()=>{S.popup='build';renderOverlay();};
    $('t-gen').onclick=()=>{S.popup='gen';renderOverlay();};
  }else{sc.hidden=true;sc.innerHTML='';return;}
  $('pclose').onclick=closeOverlay;
  fitGrids(sc);
}
function closeOverlay(){S.sheet=false;S.popup=null;renderOverlay();}
$('scrim').addEventListener('mousedown',e=>{if(e.target===$('scrim'))closeOverlay();});
$('scrim').addEventListener('click',e=>{
  const t=e.target;
  const sj=t.closest('[data-subj]');if(sj){if(S.sheet)S.sheetSubject=sj.dataset.subj==='OCBC'?'OCBC':'Singapore banks';else S.subject=sj.dataset.subj==='OCBC'?'OCBC':'Singapore banks';renderOverlay();return;}
  const gs=t.closest('[data-gsize]');if(gs){const [n,ty,z]=gs.dataset.gsize.split('|');S.gsizes[n+ty]=z;renderOverlay();return;}
  const ad=t.closest('[data-add]');
  if(ad){const name=S.sheet?S.sheetSubject:S.subject;const o=offersFor(name).find(x=>x.type===ad.dataset.add);const w={...o,id:'n'+Date.now()};
    if(S.sheet){S.widgets.push(w);S.sheet=false;renderDash();renderOverlay();document.querySelector(`[data-id="${w.id}"]`)?.classList.add('changed');}
    else{S.draft.push(w);S.gallery=false;renderOverlay();}return;}
  if(t.closest('#back')){S.gallery=false;renderOverlay();return;}
  if(t.closest('#open-gal')){S.gallery=true;renderOverlay();return;}
  const rm=t.closest('[data-remove]');if(rm&&S.draft){S.draft=S.draft.filter(w=>w.id!==rm.dataset.remove);renderOverlay();}
});

// ---------- Keyboard ----------
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(!$('runs').hidden){setPop('runs',false);$('runchip').focus();return;}
    if(!$('alerts').hidden){setPop('alerts',false);$('bell').focus();return;}
    if(S.popup&&S.gallery&&S.popup==='build'){S.gallery=false;renderOverlay();return;}
    if(S.sheet||S.popup){closeOverlay();return;}
    if(S.drawer){S.drawer=false;renderDrawer();}
  }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('q').focus();}
});

// ---------- Views ----------
function setView(v){
  S.view=v;S.running=false;S.alertsRead=false;renderRuns();renderAlerts();S.editing=v==='edit';S.sheet=v==='edit';S.drawer=v==='monitor';S.popup=v==='popup'?'build':null;S.gallery=true;S.subject='OCBC';S.sheetSubject='Singapore banks';
  S.draft=[{...DATA.ocbcW.summary,id:'d1'},{...DATA.ocbcW.question,id:'d2'}];
  document.querySelectorAll('.mockbar [data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===v));
  $('toast').hidden=true;
  renderNav();
  if(v==='monitor')renderMonitor();else renderDash();
  renderDrawer();renderOverlay();
  setPop('runs',false);setPop('alerts',false);
  if(v==='dash')setPop('runs',true);
  if(v==='monitor')setPop('alerts',true);
  $('main').scrollTop=0;
}
document.querySelectorAll('.mockbar [data-view]').forEach(b=>b.onclick=e=>{e.stopPropagation();setView(b.dataset.view);});
window.addEventListener('resize',()=>fitGrids($('scrim')));
renderRuns();renderAlerts();
setView(location.hash.slice(1)||'dash');
</script>
</body>
</html>
