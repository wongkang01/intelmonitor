[project]
name = "intelmonitor"
version = "0.1.0"
description = "IntelMonitor POC: ingest, pipeline, API and Generate agent"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.158",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
    "typesafe-sdk>=0.7.1",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
im = "intelmonitor.cli:app"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]
