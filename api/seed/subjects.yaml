# Subjects tracked by the POC: 3 topics, 5 groups, 22 entities (30 subjects).
# Every entity sits in at least one group; every group links to at least one topic.
# Aliases drive entity resolution and search query generation. Domains are the subject's own
# site, used for gap searches limited to that domain.

topics:
  - id: banking-regulation
    name: Banking regulation
    covers: Basel III implementation, capital and liquidity, AML/CFT, operational and technology resilience, supervisory enforcement
    keywords: [Basel III, capital requirements, liquidity coverage ratio, AML/CFT, anti-money laundering, operational resilience, technology risk, supervisory enforcement, bank penalty]
  - id: geopolitics
    name: Geopolitics
    covers: US-China relations, tariffs, sanctions and export controls, South China Sea, regional security events with financial effects
    keywords: [US-China relations, tariffs, sanctions, export controls, South China Sea, regional security, trade war]
  - id: stablecoins
    name: Stablecoins
    covers: Stablecoin regulation and licensing, reserves and pegs, issuer activity, bank involvement, tokenised deposits
    keywords: [stablecoin regulation, stablecoin licensing, stablecoin reserves, depeg, stablecoin issuer, tokenised deposits, tokenization]

groups:
  - id: singapore-banks
    name: Singapore banks
    topics: [banking-regulation, stablecoins, geopolitics]
    members: [dbs, ocbc, uob]
  - id: sea-regional-banks
    name: SEA regional banks
    topics: [banking-regulation, geopolitics]
    members: [maybank, cimb, bangkok-bank]
  - id: central-banks
    name: Central banks
    topics: [banking-regulation, stablecoins]
    members: [mas, fed, ecb, pboc, hkma, bnm]
  - id: stablecoin-issuers
    name: Stablecoin issuers
    topics: [stablecoins]
    members: [circle, tether, paxos, straitsx]
  - id: sea-countries
    name: SEA countries
    topics: [geopolitics]
    members: [singapore, malaysia, indonesia, thailand, vietnam, philippines]

