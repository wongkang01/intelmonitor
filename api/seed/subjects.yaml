# Subjects tracked by the POC: 10 topics and 47 entities, in 9 groups.
# Topics and entities are monitored. Groups are peer sets: sidebar headings, dashboard watchlists
# (a dashboard listing a group shows its members), peer comparison and search queries; nothing is
# screened for or tagged to a group (phase1-decisions.md, S3).
# Every entity sits in at least one group; every group links to at least one topic.
# Aliases drive entity resolution and search query generation. Domains are the subject's own
# site, used for gap searches limited to that domain.
# Entity ids that are relationship targets match the ids in seed/collected/, so the relationship
# store can link them (china there is mainland-china here).
# Screening's cache key includes every subject's description, so any change here re-screens the
# whole corpus. An entity's optional `covers` says what counts as news about it, or what does not.

topics:
  - id: banking-regulation
    name: Banking regulation
    covers: Prudential rules for banks (Basel III, capital, liquidity, large exposures, recovery and resolution), AML/CFT, and supervisory findings, penalties and enforcement against banks
    keywords: [Basel III, capital requirements, liquidity coverage ratio, AML/CFT, anti-money laundering, supervisory enforcement, bank penalty]
    icon: landmark
  - id: tech-outages
    name: IT outages
    covers: Unplanned IT outages and degraded service at financial institutions and their systems (digital banking, ATMs, payments, trading, clearing) or at the cloud, data centre, telco and software providers they rely on, even when the outage also hit other sectors; recovery against MAS downtime limits, root causes and supervisory penalties
    keywords: [bank outage, service disruption, digital banking outage, system outage, data centre outage, ATM outage, payment disruption, trading halt, unscheduled downtime, recovery time objective]
    icon: server
  - id: cyber-threats
    name: Cyber threats
    covers: Cyberattacks, ransomware, data breaches and extortion, state-linked threat campaigns, exploited vulnerabilities and zero-days, DDoS, AI-enabled attacks and deepfake impersonation, hitting financial institutions, their vendors or critical infrastructure in Singapore or overseas
    keywords: [cyberattack, ransomware, data breach, APT, UNC3886, zero-day, vulnerability exploited, DDoS, deepfake fraud, AI-enabled attack, post-quantum]
    icon: shield
  - id: third-party-risk
    name: Third-party and cloud risk
    covers: Financial institutions' dependence on cloud, data centre, software, telco and outsourced service providers; concentration risk; outsourcing and third-party risk rules and oversight; how a vendor's outage or breach spreads to the institutions that use it
    keywords: [cloud outage, third-party risk, vendor breach, outsourcing, concentration risk, supply chain attack, critical third parties, data centre]
    icon: network
  - id: tech-risk-regulation
    name: Technology risk regulation
    covers: MAS Technology Risk Management Guidelines and Notices, cyber hygiene, incident reporting, business continuity, third-party risk guidelines, AI risk management, Cybersecurity Act and CII codes, and peer rules such as EU DORA, UK critical third parties, BCBS, FSB and CPMI standards
    keywords: [technology risk management, TRM notice, cyber hygiene, incident reporting, business continuity, DORA, operational resilience, Cybersecurity Act, AI risk management]
    icon: scale
  - id: singapore-equities
    name: Singapore equities market
    covers: SGX listings, IPOs, delistings and privatisations, secondary and Global Listing Board dual listings, Equities Market Review Group and EQDP measures, valuations, liquidity, market making and research coverage, and competition from other Asian exchanges
    keywords: [SGX IPO, SGX listing, delisting, Global Listing Board, dual listing, EQDP, Equities Market Review Group, Value Unlock, STI, market making, Catalist]
    icon: trending-up
  - id: asset-management
    name: Asset management
    covers: Fund management industry in Singapore and Asia, AUM and flows, fund launches and domiciliation (VCC), manager relocations and hiring, ETFs, private markets and private credit, fund tax incentives, and rival hubs
    keywords: [assets under management, fund management, VCC, fund domiciliation, ETF launch, private credit, private equity, family office, fund tax incentive]
    icon: briefcase
  - id: fixed-income-fx
    name: Fixed income and FX
    covers: Bond issuance and listing in Singapore (SGS, corporate, Asian G3, green bonds), FX, rates and commodity derivatives volumes, and global rate or FX moves that shift Singapore market activity
    keywords: [bond issuance, SGS, Asian dollar bond, green bond, FX turnover, FX derivatives, interest rate derivatives, commodity derivatives]
    icon: banknote
  # The FMD session tests one of the next two (phase1-plan.md, Q7); the other is parked at the gate.
  - id: insurance-risk-financing
    name: Insurance and risk financing
    covers: Insurance and reinsurance hub activity, insurance-linked securities and catastrophe bonds, captives and protected cell companies, reinsurer entry or exit, Asian protection gaps and natural catastrophe losses
    keywords: [catastrophe bond, insurance-linked securities, reinsurance, captive insurance, protected cell company, protection gap, natural catastrophe losses]
    icon: umbrella
  - id: infrastructure-finance
    name: Infrastructure and transition finance
    covers: Financing of Asian infrastructure and energy transition, project and blended finance (FAST-P), green and transition bonds and loans, ASEAN Power Grid, and insurer or institutional investment in infrastructure
    keywords: [infrastructure finance, project finance, blended finance, FAST-P, transition finance, ASEAN Power Grid, green loan, infrastructure bond]
    icon: building-2

groups:
  - id: singapore-banks
    name: Singapore banks
    topics: [banking-regulation, tech-outages, cyber-threats, third-party-risk]
    members: [dbs, ocbc, uob]
  - id: central-banks
    name: Central banks and regulators
    topics: [banking-regulation, tech-risk-regulation, fixed-income-fx]
    members: [mas, hkma, bnm, bank-of-thailand, ojk]
  - id: exchanges
    name: Exchanges
    topics: [singapore-equities, fixed-income-fx, tech-outages]
    members: [sgx, hkex]
  - id: payment-systems
    name: Payment systems
    topics: [tech-outages, cyber-threats]
    members: [meps-plus, fast, paynow, giro, nets, bcs, swift, visa, mastercard]
  - id: tech-providers
    name: Technology providers
    topics: [tech-outages, cyber-threats, third-party-risk]
    members: [aws, microsoft-azure, microsoft-365, google-cloud, oracle-cloud, equinix, crowdstrike, singtel, thought-machine, toppan-next-tech]
  # Exchange hacks and outages, custody and reserve bank concentration, AML/CFT enforcement.
  - id: digital-assets
    name: Digital assets
    topics: [cyber-threats, tech-outages, third-party-risk, banking-regulation]
    members: [circle, straitsx, okx, coinbase]
  - id: sea-countries
    name: SEA countries
    topics: [banking-regulation, fixed-income-fx, infrastructure-finance]
    members: [singapore, malaysia, indonesia, thailand, vietnam]
  - id: other-countries
    name: Other countries and territories
    topics: [banking-regulation, fixed-income-fx]
    members: [hong-kong, mainland-china, taiwan, india, united-kingdom, australia, south-korea]
  - id: sectors
    name: Sectors
    topics: [banking-regulation]
    members: [building-construction, housing]

