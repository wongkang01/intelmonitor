# Technology and infrastructure dependencies of Singapore financial institutions.
#
# Purpose: standing links "FI X depends on vendor or system Y", stored once, so that any
# future news naming Y (a vendor, payment system or cloud region) can be routed to X as a
# possible indirect impact. Built for the TCRD scenario "a major cloud or payment provider
# has just reported an outage: which Singapore FIs should we worry about?".
# Collected 2026-10-07 from free public sources only. Every public or reported row was
# checked against the source page text; quotes are verbatim (whitespace normalised).
#
# Schema
#   relationships:            one row per (from, to, type)
#     from, to                entity ids (see new_entities and the shared id list)
#     type                    depends_on | participates_in | owns | operates_in
#                             participates_in = member or participant of a payment system,
#                             card scheme or market infrastructure (complete lists where the
#                             operator publishes one); operates_in = vendor region in a country
#     detail                  one plain sentence; group-level links say so
#     service                 cloud | data_centre | security | telco | core_banking | payments
#                             | print_mail | market_infrastructure
#     evidence                public = primary or reputable source states it;
#                             reported = secondary source only; assumed = industry norm, no source
#     source_url, source_title, published (source date or null), quote (verbatim, or null if assumed)
#   incidents:                short list of past incidents cited as evidence for links above
#     id, date, vendor, summary, affected [ids], impact, mas_action (or null),
#     source_url, source_title, quote
#   new_entities:             ids used here that are not in the shared id list
#     id, name, kind (bank | insurer | tech_provider | market_infrastructure | agency | country), aliases
#
# Notes
#   - PayNow participants on abs.org.sg are shown as logos; each row names the logo's link.
#   - Group-level cloud deals (Citi, HSBC, Standard Chartered, Maybank) are mapped to the
#     Singapore entity; the detail says the deal is group-level.
#   - Cloud region rows quote adjacent cells of the vendor's region table, joined by spaces.
#   - participates_in swift rows for GIRO banks come from the BIC column of the ABS list of
#     participating GIRO banks; the BIC is named in the detail.
#   - Complete lists: FAST (ABS fact sheet 7 Jul 2026), PayNow (ABS page), MEPS+ direct
#     participants (MAS, as of 26 Jun 2026), Interbank GIRO and eGIRO (ABS), NETS debit banks.
#     SGX-DC clearing members date from SGX's 2010 OTC clearing launch and are not a current list.

