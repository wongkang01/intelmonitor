incidents:
- id: equinix-sg-2023-10
  date: 2023-10-14
  vendor: equinix
  summary: A cooling system malfunction at the Equinix Singapore data centre hosting DBS and Citibank IT systems shut them down, and both banks failed to recover at backup sites within 4 hours.
  affected:
  - dbs
  - citibank
  impact: About 2.5 million payment and ATM transactions failed and up to 810,000 digital banking logins failed between 2.54pm on 14 Oct and 4.47am on 15 Oct 2023.
  mas_action: MAS directed both banks to investigate; in Nov 2023 it imposed a six-month pause on DBS non-essential IT changes and acquisitions and kept the 1.8x operational risk capital multiplier.
  source_url: https://www.mas.gov.sg/news/parliamentary-replies/2023/oral-reply-to-parliamentary-question-onbanking-services-disruption-of-dbs-and-citibank
  source_title: Oral reply to Parliamentary Questions on banking services disruption of DBS and Citibank on 14 October 2023
  quote: These outages were caused by a malfunction of the cooling system in the data centre hosting both DBS’ and Citibank’s IT systems.
- id: crowdstrike-2024-07
  date: 2024-07-19
  vendor: crowdstrike
  summary: A faulty CrowdStrike security update crashed Windows systems worldwide; in Singapore it disrupted SGX's post-trade services on CDP while bank critical systems were largely unaffected.
  affected:
  - cdp
  - sgx
  impact: CDP post-trade outage of about five hours; a limited number of trades rolled over to the next business day.
  mas_action: MAS asked major FIs to report impact and extended MEPS+ operating hours by two hours to 9pm as a precaution.
  source_url: https://www.mas.gov.sg/news/parliamentary-replies/2024/written-reply-to-parliamentary-question-on-the-impact-of-global-it-outage-on-financial-institutions
  source_title: Written reply to Parliamentary Question on the impact of global IT outage on financial institutions
  quote: The Singapore Exchange experienced a temporary disruption to its post trade services on the Central Depository, resulting in a limited number of trades being rolled over for settlement on the next business day.
- id: singtel-2024-10
  date: 2024-10-08
  vendor: singtel
  summary: A failed failover in Singtel's fixed voice system cut calls to emergency lines and to bank, hospital and government hotlines for about four hours.
  affected:
  - dbs
  - uob
  - standard-chartered-singapore
  impact: About 500,000 residential and corporate users affected; bank customer care hotlines unreachable.
  mas_action: null
  source_url: https://mothership.sg/2025/12/imda-fines-singtel-1-million/
  source_title: IMDA fines Singtel S$1 million for Oct. 2024 outage that affected emergency services (Mothership)
  quote: Singtel has been fined S$1 million by the Infocomm Media Development Authority (IMDA) for a widespread service outrage that occurred on Oct. 8, 2024.
- id: toppan-next-tech-2025-04
  date: 2025-04-06
  vendor: toppan-next-tech
  summary: Ransomware at printing vendor Toppan Next Tech exposed statement data of DBS and Bank of China Singapore customers.
  affected:
  - dbs
  - bank-of-china
  impact: Customer information extracted; no login credentials compromised.
  mas_action: MAS engaged the affected banks on risk mitigation and customer follow-up; CSA assisted TNT.
  source_url: https://www.mas.gov.sg/news/media-releases/2025/ransomware-attack-on-toppan-next-tech
  source_title: Ransomware Attack on Toppan Next Tech (MAS and CSA joint media release)
  quote: The attack has led to customer information from DBS Bank and Bank of China Limited, Singapore branch, being extracted by the threat actor.
- id: datapost-2025-05
  date: 2025-05-25
  vendor: datapost
  summary: Ransomware at printing and mailing vendor DataPost exposed Income Insurance policyholders' annual bonus statements.
  affected:
  - income-insurance
  impact: At least 146 policyholders' bonus statements compromised; Income suspended all DataPost print jobs.
  mas_action: null
  source_url: https://www.income.com.sg/about-us/corporate-information/press-releases/income-insurance-made-aware-of-dataposts-ransomwa
  source_title: Income Insurance made aware of DataPost’s ransomware incident, affecting policyholders’ annual bonus statements
  quote: Based on DataPost’s preliminary investigations, at least 146 policyholders' bonus statements have been compromised.
- id: azure-gateway-2026-09
  date: 2026-09-30
  vendor: microsoft-azure
  summary: A change to Azure's regional gateway management service degraded ExpressRoute, VPN and Application Gateway connectivity in 18 regions including Southeast Asia (Singapore); no Singapore FI impact was publicly reported.
  affected: []
  impact: 20:30 UTC 30 Sep to 02:15 UTC 1 Oct 2026; Southeast Asia was among the last regions to recover.
  mas_action: null
  source_url: https://azure.status.microsoft/en-us/status/history/
  source_title: Azure status history, Tracking ID 7Q30-010
  quote: Between 20:30 UTC on 30 September 2026 and 02:15 UTC on 01 October 2026, a subset of customers using gateway services in multiple regions experienced degraded or interrupted network connectivity.

