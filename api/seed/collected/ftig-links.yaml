# FTIG relationship map: Circle, StraitsX, OKX, Coinbase (collected 2026-10-19).
#
# Purpose: lets the dashboard trace how news at one digital asset firm reaches another, a Singapore
# bank, a payment system or MAS, and which reserves, counterparties and revenue lines matter.
# Every quote was checked against the text of the page or filing named in source_url (whitespace,
# zero-width characters and footnote markers normalised; table cells joined with " | ").
# Sources: SEC filings (10-K, 10-Q, 8-K, DEF 14A, N-MFP3), the MAS Financial Institutions
# Directory and media releases, StraitsX reserve reports and disclosures, the OKX Proof of
# Reserves page, regulators' public registers (ESMA, VARA, SFC, SCB) and press, named per row.
# api/scripts/build_relationships.py reads this file with the three other collected files.
#
# Sections
#   relationships            entity-links.yaml schema: from, to, type (owns | subsidiary_of | operates_in
#                            | shareholder_of | member_of | partner_of | listed_on | supervised_by), share,
#                            detail, evidence, as_of, source_url, source_title, quote.
#                            Licences held by local subsidiaries are supervised_by edges from that subsidiary;
#                            the subject `owns` the subsidiary (share null when no stake is published), because
#                            impact paths start at a subject and walk owns as a first hop
#                            (okx owns okx-sg, okx-sg supervised_by mas). A child -> subject subsidiary_of edge
#                            would never be walked.
#                            partner_of rows are kept for the record; the build drops them.
#   depends_on_participates  tech-dependencies.yaml schema: from, to, type (depends_on | participates_in),
#                            detail, service, evidence, source_url, source_title, published, quote. Services
#                            beyond the tech file's: custody, banking, blockchain, distribution,
#                            reserve_management. One undated source carries as_of instead of published.
#                            Edges into a subject from an existing subject (visa, mastercard depends_on circle)
#                            route Circle news to the card networks.
#   exposures                bank-exposures.yaml style generalised to any entity: entity, dimension
#                            (reserve_composition | revenue | counterparty | specific), measure, segment (issuer's own
#                            label), target (endpoint id), value, unit, share_of_total, period, source_url,
#                            source_title, page, quote, note. Each row becomes part of exposed_to entity -> target:
#                            the first row with a share for an (entity, target) is the headline, and the others
#                            ride along as figures. The build maps measures to the store's (fair_value and
#                            reserve_assets to reserve_assets, the revenue measures to revenue) and drops
#                            rows that are not standing exposures (DROPPED_MEASURES, NOT_STANDING there).
#                            Circle's dealer rows are look-through exposures of the Circle Reserve Fund.
#   groups                   members imply member_of edges (not repeated in relationships).
#   new_entities             ids not in api/seed/subjects.yaml or the other collected files.
#
# Kinds used in new_entities
#   From the entity-links header: bank, broker, exchange, regulator, central-bank, investor, person, consortium,
#   platform, index, country. Also the endpoint kinds sector (reserve asset classes and rate or market
#   factors), blockchain (chains), stablecoin_issuer, digital_asset_firm and payment_institution.
#
# Id notes
#   - The endpoint `xfers` (Xfers Pte. Ltd., FID trading names "Fazz; StraitsX") is the subject `straitsx`:
#     RENAME in build_relationships.py maps xfers -> straitsx, so the tech file's xfers participates_in
#     fast and paynow rows attach to the subject. Edges here already use `straitsx`.
#   - nasdaq exists as an endpoint of kind tech_provider; reused for coinbase listed_on.
#   - citibank and jpmorgan (existing endpoints) stand for the Citi and J.P. Morgan groups in Circle's dealer rows.

