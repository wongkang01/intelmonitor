groups:
- id: bloom
  name: BLOOM (MAS settlement initiative)
  kind: platform
  members:
  - mas
  - dbs
  - ocbc
  - uob
  - partior
  detail: 'MAS initiative launched 16 October 2025 to extend Project Orchid to settlement in tokenised bank liabilities
    and regulated stablecoins. Workstreams: settlement assets (Circle, DBS, OCBC, Partior, Stripe, UOB), programmable
    compliance (Ant International, StraitsX), agentic payments (Coinbase, DBS). Circle, StraitsX and Coinbase link
    to it by participates_in edges, so they are not repeated as members.'
  source_url: https://www.mas.gov.sg/news/media-releases/2025/mas-launches-bloom-initiative-to-extend-settlement-capabilities
  quote: Members working on this include Circle, DBS, OCBC, Partior, Stripe and UOB.
- id: okxice
  name: OKXICE
  kind: consortium
  members:
  - okx
  - ice
  detail: Joint venture of OKX and Intercontinental Exchange set up after ICE's March 2026 investment. On 4 Oct
    2026 it filed with the SEC for a tokenised venue for 24/7 trading of more than 60 US stocks. Andrew Cuomo is
    co-chair. Reported as 50-50 and running on OKX's X Layer, both unverified on a primary page.
  source_url: https://www.thestar.com.my/tech/tech-news/2026/10/05/okx-joint-venture-files-with-sec-to-launch-tokenized-trading-platform
  quote: OKXICE, the joint venture between crypto exchange OKX and Intercontinental Exchange, filed with the Securities
    and Exchange Commission on Sunday to launch a tokenized securities platform for around-the-clock trading of
    US stocks.
- id: global-dollar-network
  name: Global Dollar Network (USDG)
  kind: consortium
  members:
  - okx
  detail: Paxos-led stablecoin network for USDG, which Paxos Digital Singapore (an MAS-licensed MPI) issues. OKX
    joined as a core partner on 14 Jul 2025. Other partners include Anchorage Digital, Bullish, Kraken, Paxos, Robinhood
    and Worldpay.
  source_url: https://globaldollar.com/newsroom/okx-joins-global-dollar-network-alongside-leading-brands-including-worldpay-kraken-anchorage-digital-paxos-robinhood-and-30-additional-partners
  quote: announces that OKX, a leading global exchange, has joined the network as a core partner.
