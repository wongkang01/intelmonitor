groups:
  - id: partior
    name: Partior
    kind: consortium
    members: [dbs, jpmorgan, standard-chartered, temasek, deutsche-bank]
    detail: "Bank-owned blockchain clearing and settlement network founded in 2021 by DBS, J.P. Morgan, Standard Chartered and Temasek; Deutsche Bank joined the Series B in 2024, with Peak XV, Jump Trading and Valor Capital also investors."
    source_url: https://partior.com/about-us/our-story
    quote: "Established as an independent entity with founding shareholders DBS, J.P. Morgan, Standard Chartered, and Temasek."
  - id: climate-impact-x
    name: Climate Impact X (Verified Impact Exchange Holdings)
    kind: consortium
    members: [dbs, sgx, standard-chartered, temasek]
    detail: "Carbon credit exchange set up as a joint venture of DBS, SGX, Standard Chartered and Temasek."
    source_url: https://links.sgx.com/1.0.0/corporate-announcements/87136S2Z8FGAWSKJ/701899_DBS_706A_announcement_2H21.pdf
    quote: "DBSH refers to its announcement released on 20 May 2021 relating to the intention of DBS Bank, Singapore Exchange Limited (“SGX”), Standard Chartered Bank (Singapore) Limited and Temasek to develop a carbon exchange and marketplace."
  - id: nets-owners
    name: NETS shareholder banks
    kind: consortium
    members: [dbs, ocbc, uob]
    detail: "DBS, OCBC and UOB own NETS in equal shares and rotate its chairmanship every three years; BCS sits inside the NETS Group."
    source_url: https://www.nets.com.sg/newsroom/nets-appoints-jeremy-soo-dbs-managing-director-and-head-of-consumer-banking-group-as-new-chairman
    quote: "The Chairmanship of NETS is rotated among the three shareholder banks, DBS, OCBC and UOB every three years."
  - id: mas-abs-act
    name: MAS-ABS AI-Driven Cyber and Technology Risk Taskforce (ACT)
    kind: taskforce
    members: [mas, abs, dbs, ocbc, uob, sgx, nets, bcs]
    detail: "Industry taskforce announced on 28 July 2026, meeting since May 2026, on cyber and technology risks from frontier AI models."
    source_url: https://www.mas.gov.sg/news/media-releases/2026/mas-and-abs-establish-taskforce-to-strengthen-cyber-and-technology-resilience
    quote: "The Taskforce includes members from MAS, ABS, DBS, OCBC, UOB, Singapore Exchange (SGX), Network for Electronic Transfers (NETS), and Banking Computer Services (BCS), to address emerging AI-driven threats through collaboration, innovation and shared expertise."
  - id: cosmic
    name: COSMIC (Collaborative Sharing of ML/TF Information & Cases)
    kind: platform
    members: [mas, dbs, ocbc, uob, citibank, hsbc, standard-chartered]
    detail: "MAS AML/CFT information-sharing platform launched 1 April 2024, co-developed with six banks that are its initial participants."
    source_url: https://www.mas.gov.sg/news/media-releases/2024/mas-launches-cosmic-platform
    quote: "COSMIC was co-developed by MAS and six major commercial banks in Singapore - DBS, OCBC, UOB, Citibank, HSBC and Standard Chartered Bank."
  - id: project-guardian
    name: Project Guardian
    kind: platform
    members: [mas, dbs, ocbc, uob, sgx, citibank, hsbc, jpmorgan, standard-chartered, deutsche-bank]
    detail: "MAS asset tokenisation initiative; its industry group had 24 financial institutions in 2024, also including ADDX, Apollo, BNY, Euroclear, Franklin Templeton, Moody's, S&P Global, SBI, Schroders, T. Rowe Price and UBS."
    source_url: https://www.mas.gov.sg/-/media/mas/news/media-releases/2024/annex-a--list-of-participants-in-project-guardian-industry-group.pdf
    quote: "The table below provides the list of financial institutions participating in Project Guardian."
  - id: global-layer-one
    name: Global Layer One (GL1)
    kind: platform
    members: [mas, citibank, jpmorgan]
    detail: "MAS-led shared ledger initiative for tokenised assets with BNY, Citi, J.P. Morgan, MUFG and SG Forge; ECB, Banque de France and IMF staff observe. DBS, OCBC and UOB are not named."
    source_url: https://www.mas.gov.sg/news/media-releases/2024/mas-expands-industry-collaboration-to-scale-asset-tokenisation-for-financial-services
    quote: "Under the GL1 initiative, MAS is collaborating with international policymakers and financial institutions including BNY, Citi, J.P. Morgan, MUFG Bank, Ltd., and Societe Generale-FORGE (SG Forge) on the business, governance, risk, legal and technology considerations of a shared ledger infrastructure."
  - id: project-orchid
    name: Project Orchid (purpose-bound money trials)
    kind: platform
    members: [mas, dbs, ocbc, uob]
    detail: "MAS digital Singapore dollar project; in 2022 DBS, OCBC and UOB each ran a purpose-bound money trial with a government agency."
    source_url: https://www.mas.gov.sg/news/media-releases/2022/mas-report-on-potential-uses-of-a-purpose-bound-digital-singapore-dollar
    quote: "Government Payouts : OCBC Ltd (OCBC) and the Central Provident Fund Board (CPFB) will test the use of PBM for funds disbursement from government agencies, without requiring recipients to have a bank account."
  - id: nexus-global-payments
    name: Project Nexus / Nexus Global Payments
    kind: consortium
    members: [mas, bnm, rbi, bsp, bank-of-thailand, bank-indonesia]
    detail: "Singapore-incorporated company set up by five central banks in 2025 to run a multilateral instant cross-border payment scheme; Bank Indonesia joined in early 2026 (reported)."
    source_url: https://www.bot.or.th/en/news-and-media/news/news-20250403.html
    quote: "The first mover central bank partners in Project Nexus - Reserve Bank of India, Bank Negara Malaysia, Bangko Sentral ng Pilipinas, the Monetary Authority of Singapore, and Bank of Thailand – have formally incorporated Nexus Global Payments (NGP) in Singapore to operationalise and manage the multilateral instant cross-border payments scheme."
  - id: sti
    name: Straits Times Index
    kind: index
    members: [dbs, ocbc, uob, sgx]
    detail: "Tracked constituents and weights at 30 Sep 2026: DBS 29.77%, OCBC 19.57%, UOB 9.79%, SGX 3.49%; the three banks are almost 60% of the index. SGX also co-created the index series with SPH and FTSE."
    source_url: https://research.ftserussell.com/Analytics/FactSheets/Home/DownloadSingleIssue?issueName=STI&IsManual=False
    quote: "It is also the headline index of the FTSE ST Index Series, a family of indices created by Singapore Press Holdings (SPH), Singapore Exchange (SGX) and FTSE Group (FTSE), offering a wider set of investment choices and opportunities by segmenting the Singapore market."
  - id: mas-dsib
    name: MAS domestic systemically important banks
    kind: association
    members: [dbs, ocbc, uob, citibank, maybank, standard-chartered, hsbc]
    detail: "Banks MAS designated as D-SIBs in its inaugural 2015 list; they face higher capital requirements and are the subject of MAS stress tests. This is a regulatory designation, not a voluntary association."
    source_url: https://www.mas.gov.sg/news/media-releases/2015/mas-publishes-framework-for-domestic-systemically-important-banks-in-singapore
    quote: "MAS has designated the following banking groups as D-SIBs: DBS Bank; Oversea-Chinese Banking Corporation; United Overseas Bank; Citibank; Malayan Banking Berhad; Standard Chartered Bank; and The Hongkong and Shanghai Banking Corporation."

