# Structural links between tracked financial entities (collected 2026-10-07).
#
# Purpose: lets the dashboard back claims such as "DBS and OCBC have a lot in
# common because of X" with typed, sourced edges, and trace how an event at one
# entity can reach another through ownership, group structure, shared ventures,
# shared memberships, market listings and supervisors.
# IT vendors and payment-system participation are collected separately and are
# deliberately not repeated here (NETS appears only as an owned company and a
# taskforce member).
#
# Sections
#   relationships: directed edges.
#     from, to     entity ids (existing subject ids or ids declared in new_entities)
#     type         owns | subsidiary_of | operates_in | shareholder_of | member_of
#                  | partner_of | listed_on | supervised_by
#                  Ownership is recorded once, parent -> child, as `owns`.
#                  `subsidiary_of` is used only where a source says the entity is
#                  part of a group without giving a stake.
#                  `partner_of` also covers deal counterparties (e.g. a bank that
#                  bought another bank's business); `detail` says which.
#     share        ownership or voting fraction (0..1) when the source gives one, else null
#     detail       one plain sentence
#     evidence     public = primary or reputable source states it; reported = secondary only
#     as_of        date the fact holds, per the source
#     source_url, source_title
#     quote        verbatim text seen on the page (footnote markers dropped). For tables, the heading and
#                  row cells are joined with " | " (cell text itself is verbatim).
#   groups: named multi-member ventures, platforms, taskforces and indices.
#     Each member implies a member_of edge to the group id; those edges are not
#     repeated in relationships. Members list only ids known to this file;
#     `detail` names other notable members.
#   new_entities: ids introduced here (kebab-case). kind is one of bank, insurer,
#     broker, exchange, regulator, central-bank, company, investor, person,
#     consortium, platform, taskforce, index, association, country.

