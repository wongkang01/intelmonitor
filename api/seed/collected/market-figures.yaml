# Market figures for the FMD (MAS Financial Markets Development) user test.
# Collected 2026-10-07 by hand from free public sources: SGX monthly market statistics reports (links.sgx.com),
# HKEX Monthly Market Highlights, MAS publications and media releases, HKMA, and ADB AsianBondsOnline.
# Numbers are exactly as published (units as in the source table). Nothing is estimated or derived.
#
# Schema
#   collected: the day the figures were collected; the app treats none as known later than this.
#   series[]: one tracked figure.
#     id             dotted id, source prefix first (sgx., hkex., mas., mas_ams., hkma., adb.)
#     name           human label shown on the Data tab
#     subject        tracked subject id: sgx | hkex | singapore-equities | asset-management | fixed-income-fx
#     unit           unit as published (SGD m = S$ million, HKD m = HK$ million, etc.)
#     frequency      monthly | quarterly | yearly
#     bad_direction  up | down | none: which move is unwelcome for Singapore's markets (peers are none)
#     source_name    publication the figures come from
#     observations[] period (YYYY-MM, YYYY-Qn or YYYY), value, source_url, quote
#                    quote is the verbatim sentence, or for tables the column header line and the row joined by " / ".
#                    Text in [square brackets] marks a value read from a chart rather than a sentence.
#   tickers[]: Yahoo Finance tickers the pipeline already fetches or should fetch (not collected here).
#              SORA comes from the existing MAS source, not Yahoo.
#   gaps[]: missing months and items that could not be found.
#
# Notes
#   SGX values for a month come from the latest report that shows it, since SGX carries late adjustments forward
#   (only sgx.ipo_funds_mainboard 2025-09 was revised: 1,030 in the Sep 2025 report, 1,114 later).
#   SGX IPO funds include RTOs. HKEX newly listed counts include GEM to Main Board transfers.
#   HKEX "$" is HK dollars.
