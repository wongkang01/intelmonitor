gaps:
- 'sgx.*: 2025-05 missing. The May 2025 SGX monthly statistics report was not found on links.sgx.com; the 18-month window otherwise runs 2025-03 to 2026-08 (2025-03, 2025-04 and 2025-06 come from the prior-year column of the 2026 reports).'
- 'sgx.*: 2026-09 not yet published (SGX releases around the 8th to 10th of the following month).'
- 'sgx Global Listing Board: no GLB listing or trading figures found. GLB (SGX-Nasdaq dual listing board) was announced 19 Nov 2025 for a mid-2026 launch; the Securities and Futures (Amendment) Bill had its second reading on 7 May 2026. No GLB line appears in the June or August 2026 SGX statistics reports.'
- 'hkex.adt: 2025-03 to 2025-07 missing; the HKEX Monthly Market Highlights page archive only goes back to September 2025 (August 2025 comes from the September 2025 page).'
- 'hkex.ipo_funds_ytd: HKEX publishes only cumulative year-to-date IPO funds, not a monthly figure. December 2025 is the full-year 2025 total; January 2026 is the single month.'
- 'hkex.market_cap and hkex.newly_listed: before 2025-09 only the same-month-prior-year column is available, so hkex.market_cap starts 2025-09.'
- 'Bursa Malaysia / SET Thailand monthly turnover: not collected (optional item, no time spent beyond tickers).'
- 'mas.fx_adtv for 2022: the MAS release gives only the 60% growth, not the April 2022 level, so it is left out rather than derived.'
- 'Singapore corporate bond issuance: no monthly or quarterly MAS series found. Annual MAS figures and ADB quarterly estimates are given; ADB quarterly corporate issuance for 2025-Q4 to 2026-Q2 was published only as % changes.'
- 'Asian dollar bond market (ACU) data: not collected; MAS no longer publishes a standalone Asian dollar bond series in the sources found.'
