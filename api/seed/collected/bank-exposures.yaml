# Singapore bank exposure data (DBS, OCBC, UOB), collected 2026-10-07 from free public disclosures.
#
# Purpose: route news about a market or sector (e.g. Hong Kong property) to the Singapore banks
# exposed to it, with the exposure size and its source as evidence.
#
# Periods: DBS 2Q26, OCBC 1H26, UOB 1H26 (all period end 2026-06-30), except one DBS Bank India
# row (FY ended 2026-03-31). Sources: DBS 2Q26 performance summary and Pillar 3; UOB condensed
# interim financial statements, CFO slides and Pillar 3; OCBC 1H26 financial highlights, results
# presentation and Pillar 3.
#
# Schema
#   exposures[]: one reported figure each.
#     bank            dbs | ocbc | uob
#     dimension       geography | industry | currency | specific | ccyb_country
#                     (currency = loans by currency, a proxy where geography is coarse;
#                      specific = named concentration disclosed outside the standard tables;
#                      ccyb_country = Pillar 3 MAS Notice 637 countercyclical buffer template)
#     measure         gross_customer_loans | npl | npl_ratio | npa_coverage | rwa
#                     (rwa = RWA for private sector credit exposures used in the CCyB computation)
#     segment         the bank's own label, verbatim
#     market          normalised kebab-case id, defined in markets[]
#     value, unit     exactly as reported (SGD m, SGD b, %)
#     share_of_total  value / total given in the same table (fraction, 4 dp); null for ratios
#     period          period end date
#     source_url, source_title, page (PDF page index, 1-based; null for web pages)
#     quote           the table row or sentence as extracted (whitespace collapsed) so it can be checked
#     note            optional caveat
#   markets[]: id, name, and each bank's labels mapped to that id.
#   gaps[]: items asked for but not available or not extractable.
#
# Caveats
#   - Geography definitions differ: DBS uses borrower's place of incorporation; OCBC and UOB use
#     where the credit risk resides. Residual buckets (Rest of the World, Others) are not comparable.
#   - CCyB tables list only jurisdictions with a non-zero CCyB; Singapore, mainland China, India, the
#     US and ASEAN sit inside the residual 'Others' row.
#   - 'Building and construction' is the closest standard proxy for real estate lending in all three
#     banks; none publishes a CRE-by-market split in the 1H26 documents.

