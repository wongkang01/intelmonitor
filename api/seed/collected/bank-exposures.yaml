gaps:
- bank: dbs
  item: Commercial real estate by market (Hong Kong CRE, US CRE)
  detail: Not quantified in the 2Q26 performance summary, CFO/CEO decks, media or analyst transcripts. The analyst transcript only says general provisions were taken for Hong Kong real estate. Press reports
    (The Edge Singapore, 2024-25) cite DBS CRE of about S$90b with Hong Kong S$18b, but the articles returned HTTP 403 and could not be verified, so no row was recorded.
- bank: dbs
  item: Mainland China and Taiwan loans
  detail: Only 'Rest of Greater China' is given by geography. Taiwan dollar and Chinese yuan loans are recorded under dimension currency as a proxy.
- bank: dbs
  item: India (DBS Bank India) loan amount
  detail: The FY2026 release gives growth (15%) and gross NPA ratio only; group tables fold India into South and Southeast Asia.
- bank: dbs
  item: NPL ratio by industry
  detail: Not published; only NPA and SP amounts by industry.
- bank: uob
  item: Commercial real estate by market
  detail: Not quantified in 2Q26 documents. CFO slides say 2Q26 new NPA came from 'a single real estate account in Greater China' and that 72% of GWB income is from non-real-estate sectors.
- bank: uob
  item: Greater China split (Hong Kong vs mainland China)
  detail: Not published in 2Q26 documents.
- bank: uob
  item: CCyB residual
  detail: Pillar 3 table gives the listed-country sum (38,329) and total (216,493) but no explicit 'Others' line, so no residual row was recorded. Sweden is shown as '#' (below S$0.5m).
- bank: ocbc
  item: Commercial real estate by market
  detail: Not quantified in 1H26 documents. The results presentation says 2Q26 new NPAs came mainly from 'two Greater China corporate real estate accounts under special mention'.
- bank: ocbc
  item: CCyB South Africa
  detail: Shown as '#' (below S$0.5m); not recorded.
- bank: all
  item: Pillar 3 real-estate asset-class rows
  detail: OCBC and UOB Pillar 3 standardised-approach tables have a 'Real estate' exposure class, but it covers only standardised-approach portfolios and is not a CRE total, so it was left out.
- bank: uob
  item: Sustainability sector exposures (SR2025)
  detail: 'UOB Sustainability Report 2025 p17 ''UOB''s corporate exposures'' is a pie chart (labels: building and construction incl. IPRE, heavy industries, transportation, fossil fuels, utilities, agriculture,
    non-climate-relevant; values 38%, 39%, 5%, 6%, 9%, <1%, 2%). Text extraction scrambles the label-to-value mapping, so nothing was recorded.'
- bank: dbs
  item: Sustainability sector exposures
  detail: Not collected (optional item, time-boxed).
- bank: ocbc
  item: Sustainability sector exposures
  detail: Not collected (optional item, time-boxed).
