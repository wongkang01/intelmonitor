# Starter dashboards, seeded once so the first screen is never blank. Each one is a
# DashboardSpec (api/intelmonitor/server/widgets.py); widgets are packed by order.

- id: singapore-banks
  name: Singapore banks
  subject_ids: [singapore-banks, banking-regulation]
  widgets:
    - {id: sgb-since, order: 0, type: since, size: L, settings: {}}
    - {id: sgb-summary, order: 1, type: summary, size: M, settings: {subject_id: singapore-banks}}
    - {id: sgb-direction, order: 2, type: direction, size: S, settings: {subject_id: banking-regulation}}
    - {id: sgb-upcoming, order: 3, type: upcoming, size: S, settings: {subject_id: banking-regulation}}
    - {id: sgb-watchlist, order: 4, type: watchlist, size: L, settings: {entity_ids: [dbs, ocbc, uob]}}
    - {id: sgb-developments, order: 5, type: developments, size: M, settings: {}}
    - {id: sgb-question, order: 6, type: question, size: S, settings: {subject_id: banking-regulation, question_id: banking-regulation.enforcement}}
