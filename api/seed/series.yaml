# Series catalogue v1 (structured-data-plan.md). `im series fetch` loads it into the series and
# series_subjects tables; adding a series from a known source needs no code change.
#
# source: where the values come from, by kind.
#   mas        table (i18, i12a, i5b, fx or sora) and field, from the MAS statistics APIs
#   fred       series id, plus lag_days: days after the period end a value is usually published
#   coingecko  coin id; daily USD price for the last 365 days
#   defillama  stablecoin id (omit for all stablecoins) and optional chain; circulating supply
#   yahoo      symbol (Yahoo Finance ticker, e.g. U11.SI or ^STI); daily close, no key
#   deviation  input and target: percent off the target, (value / target - 1) * 100
#   product    inputs [a, b]: a times b, for each period both have
#   share      part and total: percent of the total, part / total * 100, for each period both have
# Derived series (deviation, product, share) may only use series declared above them.
#
# FX direction: every FX series is SGD per one unit of the foreign currency, the MAS quote
# direction. MAS quotes Asian currencies per 100 units (fields ending in _100); they are stored per
# unit. The FX ids, units and fields must agree (checked when the seed loads).
#
# subjects: primary series belong to the subject itself; context series are shown on its page as
# system-wide or market-wide context.
#
# How a series shows on monitor pages (Indicators, Trend) and in the evidence drawer:
#   short_name  the row name under its group heading, when shorter than the name
#   group       the heading its rows sit under, e.g. Loan-to-deposit ratio; ungrouped rows lead
#   scope       system (the Singapore banking system's figures) or market (market-wide), labelled
#               "System-wide" or "Market-wide"
#   listed      false keeps an input to a derived series (a price, a per-chain supply) off the
#               Indicators; it still feeds facts, derived series and the drawer

