  # XSGD's 00:00 UTC price in USD times the same day's MAS rate, so days without a MAS rate
  # (weekends, Singapore holidays) have no value. An earlier day's rate turns FX moves into false
  # depegs; CoinGecko's own SGD price converts at a rate out of step with its USD price and is 0.5%
  # off on ten days a year, where this is never more than 0.45% off.
  - id: derived.xsgd.price_sgd
    name: XSGD price in SGD
    listed: false
    unit: SGD
    frequency: daily
    decimals: 4
    bad_direction: none
    source_url: https://www.coingecko.com/en/coins/xsgd
    source: {kind: product, inputs: [cg.xsgd.price, fx.sgd.usd]}
    subjects:
      context: [straitsx, stablecoin-issuers, stablecoins]
  - id: derived.xsgd.peg
