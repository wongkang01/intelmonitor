# Built-in standing questions. Each set applies to topics or entities, optionally narrowed to one
# topic (subject) or one entity kind (kind); groups are not monitored, so none applies to a group.
# Labels are shown in widgets.
# lookback_days: how far back an answer reads developments, counted from the run date.
# Runs are weekly, so news-flow questions look back 7 days and state questions 30.
# series: patterns over series ids (`*` spans dots) choosing, among the series mapped to the subject
#   in series.yaml, those whose facts the answer gets and may cite. A daily series' facts cover the
#   longest lookback of the subject's questions that use it.
# rules: states fixed by code instead of model judgement. deviation: the series is more than
#   `beyond` from zero, either way, for at least `for_hours` within the lookback.

sets:
  - applies_to: {type: topic}
    questions:
      - {id: topic.new-developments, label: New developments, lookback_days: 7, question: "What material developments happened on this topic?"}
      - {id: topic.direction, label: Direction, lookback_days: 14, question: "Is the picture getting more or less severe than at the last run?"}
      - {id: topic.whos-moving, label: Who's moving, lookback_days: 30, question: "Which jurisdictions or bodies took action, and are they converging or splitting?"}
      - {id: topic.upcoming, label: Upcoming, lookback_days: 60, question: "What deadlines, effective dates, meetings or consultation closes fall in the next 90 days?"}
      - {id: topic.impact, label: Impact, lookback_days: 7, question: "Which tracked groups and entities are affected, and how?"}
      - {id: topic.local-relevance, label: Local relevance, lookback_days: 7, question: "What does this mean for Singapore and MAS-supervised institutions?"}

  - applies_to: {type: topic, subject: banking-regulation}
    questions:
      - {id: banking-regulation.stage, label: Stage, lookback_days: 30, question: "Is each item a signal, consultation, proposal, enacted rule or enforcement?"}
      - {id: banking-regulation.enforcement, label: Enforcement, lookback_days: 30, question: "Were any enforcement actions or penalties announced against banks?"}

  - applies_to: {type: entity, kind: bank}
    questions:
      - {id: bank.incidents, label: Incidents, lookback_days: 7, question: "Have any material operational or technology incidents occurred?"}
      - {id: bank.adverse, label: Adverse, lookback_days: 7, question: "Is there anything that could hurt this bank?"}
      - {id: bank.regulatory, label: Regulatory, lookback_days: 30, question: "Any regulatory actions, findings or new obligations?"}
      - {id: bank.financial, label: Financial, lookback_days: 30, question: "Any material changes in earnings, capital, liquidity or asset quality?", series: ["mas.ltd.*", "mas.npl.*"]}
      - {id: bank.management, label: Management, lookback_days: 30, question: "Any senior management or board changes?"}
      - {id: bank.strategy, label: Strategy, lookback_days: 30, question: "Any significant M&A, product or technology moves?"}
      - {id: bank.digital-assets, label: Digital assets, lookback_days: 30, question: "Any stablecoin, tokenisation or crypto activity or exposure?"}
      - {id: bank.geographic-exposure, label: Geographic exposure, lookback_days: 14, question: "Is the bank exposed to any escalating geopolitical situation?"}

  - applies_to: {type: entity, kind: central_bank}
    questions:
      - {id: central-bank.policy-stance, label: Policy stance, lookback_days: 30, question: "Did the policy stance on rates, liquidity or FX change?", series: [fred.fed_funds, fred.ecb_deposit, "fx.sgd.*"]}
      - {id: central-bank.regulation, label: Regulation, lookback_days: 30, question: "Any new rules, consultations or guidance for banks?"}
      - {id: central-bank.enforcement, label: Enforcement, lookback_days: 30, question: "Any supervisory or enforcement actions?"}
      - {id: central-bank.digital-money, label: Digital money, lookback_days: 30, question: "Any moves on CBDCs, stablecoins or tokenisation?"}
      - {id: central-bank.signals, label: Signals, lookback_days: 14, question: "What did leadership signal in speeches or statements?"}
      - {id: central-bank.cross-border, label: Cross-border, lookback_days: 30, question: "Any new cooperation agreements or joint statements?"}

  - applies_to: {type: entity, kind: country}
    questions:
      - {id: country.political-stability, label: Political stability, lookback_days: 14, question: "Any political events that change policy direction or stability?"}
      - {id: country.economic-policy, label: Economic policy, lookback_days: 30, question: "Any material fiscal, monetary or FX policy moves?", series: ["fx.sgd.*"]}
      - {id: country.trade-sanctions, label: Trade and sanctions, lookback_days: 14, question: "Is the country affected by new tariffs, sanctions or export controls?"}
      - {id: country.security, label: Security, lookback_days: 14, question: "Any security or territorial incidents with financial implications?"}
      - {id: country.financial-sector, label: Financial sector, lookback_days: 30, question: "Any stress or major regulatory change in the banking system?", series: ["mas.ltd.*", "mas.npl.*"]}
      - {id: country.digital-assets, label: Digital assets, lookback_days: 30, question: "Any change in stablecoin or crypto policy?"}
