# Detectors (docs/archive/structured-data-plan.md, F3): rules over series whose firings become developments.
# Each firing is written as a source document in the "data" collection with a sentence written by
# code, and one finding tagged to the series' primary subjects; clustering, answers, triage, alerts
# and search then treat it like any other development.
#
# Every detector applies to each series its `series` pattern matches (`*` spans dots), and gives its
# developments the `materiality` level (trivial, minor, notable, significant or critical) instead
# of a Jev score; merged with news, a development keeps the higher of the two.
# A condition that holds for several observations in a row is one event, dated by its first.
#
# kind:
#   threshold  above or below: the level crosses it (from at or below `above`, or at or above `below`)
#   deviation  beyond and for_hours: a peg series more than `beyond` % off, either way, for at least
#              `for_hours` from the spell's first point
#   move       window (previous, 1w, 1m, 3m or 1y) and beyond, or sigmas: the change over the window
#              beyond a size (points for series in %, else percent) or beyond k standard deviations
#              of the series' earlier changes over that window; direction up, down or either.
#              benchmark: a series id; the change is then the series' percent change less the
#              benchmark's over the same dates, in points
#   release    beyond and direction: a monthly or quarterly release that changes by more than
#              `beyond` from the previous period
#
# Any detector may add `when`, below or at_least: it is evaluated only at points where the series'
# value, in its own unit, meets that level.
#
# The thresholds are placeholders to agree with the pilot analysts.

detectors:
  - id: ltd-above-90
    name: Loan-to-deposit ratio above 90%
    kind: threshold
    series: "mas.ltd.*"
    above: 90
    category: financial
    materiality: significant
  - id: fx-weekly-2pct
    name: SGD exchange rate moves more than 2% in a week
    kind: move
    series: "fx.sgd.*"
    window: 1w
    beyond: 2
    category: market
    materiality: notable
  - id: npl-sector-up
    name: NPL ratio up more than 0.5 points on the quarter
    kind: release
    series: "mas.npl.*"
    beyond: 0.5
    direction: up
    category: financial
    materiality: notable
  - id: ltd-release-move
    name: Loan-to-deposit ratio moves more than 2 points on the month
    kind: release
    series: "mas.ltd.*"
    beyond: 2
    category: financial
    materiality: notable

  # Share prices and markets (Yahoo Finance, FRED). Sizes from the backtest in
  # docs/archive/structured-data-plan.md, F8.
  - id: share-daily-drop
    name: Share price falls more than 3 standard deviations in a day
    kind: move
    series: "eq.*"
    window: previous
    sigmas: 3
    direction: down
    category: market
    materiality: notable
  - id: share-trails-sti
    name: Share price trails the STI by more than 5 points in a week
    kind: move
    series: "eq.sgx.*"
    benchmark: idx.sti
    window: 1w
    beyond: 5
    direction: down
    category: market
    materiality: notable
  - id: share-trails-hsi
    name: Share price trails the Hang Seng Index by more than 5 points in a week
    kind: move
    series: "eq.hkex.*"
    benchmark: idx.hsi
    window: 1w
    beyond: 5
    direction: down
    category: market
    materiality: notable
  - id: index-weekly-3sd-drop
    name: Equity index falls more than 3 standard deviations in a week
    kind: move
    series: "idx.*"
    window: 1w
    sigmas: 3
    direction: down
    category: market
    materiality: notable
  - id: asia-spread-weekly-3sd
    name: Asia corporate spread widens more than 3 standard deviations in a week
    kind: move
    series: fred.asia_em_corporate_spread
    window: 1w
    sigmas: 3
    direction: up
    category: market
    materiality: notable
  - id: sora-weekly-3sd-up
    name: SORA rises more than 3 standard deviations in a week
    kind: move
    series: mas.sora
    window: 1w
    sigmas: 3
    direction: up
    category: market
    materiality: notable

  # Global rates and risk sentiment (FRED), tagged to Fixed income and FX.
  - id: fed-funds-change
    name: Fed funds rate change
    kind: move
    series: fred.fed_funds
    window: previous
    beyond: 0.1
    category: market
    materiality: notable
  - id: ecb-deposit-change
    name: ECB deposit rate change
    kind: move
    series: fred.ecb_deposit
    window: previous
    beyond: 0.1
    category: market
    materiality: notable
  - id: us10y-weekly-3sd
    name: US 10-year yield moves more than 3 standard deviations in a week
    kind: move
    series: fred.us10y
    window: 1w
    sigmas: 3
    category: market
    materiality: notable
  - id: hy-spread-above-5
    name: US high-yield spread above 5 points
    kind: threshold
    series: fred.us_hy_spread
    above: 5
    category: market
    materiality: notable
  - id: vix-above-30
    name: VIX above 30
    kind: threshold
    series: fred.vix
    above: 30
    category: market
    materiality: notable
